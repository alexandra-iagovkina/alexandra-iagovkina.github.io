name: Import portfolio assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-portfolio-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download approved portfolio assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/cadoo
          curl -fL 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-c614-81f4-bb41-f1966f4d051f/raw?se=2026-09-19T18%3A48%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=5c54607c-1738-5d6c-a06b-12108cd0ad29&skoid=b971d227-1348-4524-8797-edb0fdf15147&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-19T05%3A13%3A31Z&ske=2026-09-20T05%3A13%3A31Z&sks=b&skv=2026-02-06&sig=Iqy2tLwTNRa0gpOS80baqJmYiGmTQTJdZ22oKa62ajw%3D' -o assets/cadoo/cadoo-01.webp
