name: Build preview favicon

on:
  push:
    branches: [portfolio-preview]
    paths:
      - ".github/workflows/build-preview-favicon.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  favicon:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-preview

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      - name: Build square favicon without distortion
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          src = Image.open("portfolio/assets/logo.png").convert("RGBA")

          # Crop only transparent outer padding, never distort the mark.
          alpha = src.getchannel("A")
          bbox = alpha.getbbox()
          if bbox:
              src = src.crop(bbox)

          out_dir = Path("preview/assets")
          out_dir.mkdir(parents=True, exist_ok=True)

          for size, pad in [(64, 7), (180, 18), (256, 24)]:
              canvas = Image.new("RGBA", (size, size), (0,0,0,0))
              max_w = size - pad*2
              max_h = size - pad*2
              scale = min(max_w/src.width, max_h/src.height)
              w = max(1, round(src.width*scale))
              h = max(1, round(src.height*scale))
              resized = src.resize((w,h), Image.Resampling.LANCZOS)
              x = (size-w)//2
              y = (size-h)//2
              canvas.alpha_composite(resized, (x,y))
              canvas.save(out_dir/f"favicon-{size}.png", optimize=True)

          # Also make .ico with common browser sizes.
          master = Image.open(out_dir/"favicon-256.png").convert("RGBA")
          master.save(out_dir/"favicon.ico", sizes=[(16,16),(32,32),(48,48),(64,64)])
          PY

      - name: Commit favicon
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/assets/favicon-64.png preview/assets/favicon-180.png preview/assets/favicon-256.png preview/assets/favicon.ico
          git diff --cached --quiet && exit 0
          git commit -m "Fix preview favicon proportions"
          git push origin HEAD:portfolio-preview
