          curl -fL 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-4b14-81f4-82e2-b951ea1cb3dc/raw?se=2026-09-19T19%3A29%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=4ea14f8b-4804-5876-8c7a-25675ac56a7c&skoid=b971d227-1348-4524-8797-edb0fdf15147&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-19T09%3A25%3A25Z&ske=2026-09-20T09%3A25%3A25Z&sks=b&skv=2026-02-06&sig=VyTs6ysHEX2PsH8fQzuJfTk7YzBEBzywxCUgzGsgpx8%3D' -o preview/assets/cadoo/cadoo-05.png
          curl -fL 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-1a84-81f4-b885-973e2db0168a/raw?se=2026-09-19T19%3A29%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=95fb08e8-f3b7-57dd-b55c-2c6ca219272f&skoid=b971d227-1348-4524-8797-edb0fdf15147&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-19T08%3A17%3A23Z&ske=2026-09-20T08%3A17%3A23Z&sks=b&skv=2026-02-06&sig=5VdRqUnArxBhNw2nmmyMOSMV37i0eTej%2BIxVbwY4KnQ%3D' -o preview/assets/cadoo/cadoo-06.png
          curl -fL 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-31b8-81f4-9936-4f2dca603318/raw?se=2026-09-19T19%3A29%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=f1d546c8-51bd-5a5c-91d6-e2146073c3ae&skoid=b971d227-1348-4524-8797-edb0fdf15147&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-19T18%3A09%3A41Z&ske=2026-09-20T18%3A09%3A41Z&sks=b&skv=2026-02-06&sig=KV2og1naLBPZhXIzbkaIsrFQvNxZxPntu9EUeFYotOQ%3D' -o preview/assets/cadoo/cadoo-07.png
          curl -fL 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-b9d4-820a-99c4-d90a722fbfb9/raw?se=2026-09-19T19%3A29%3A26Z&sp=r&sv=2026-02-06&sr=b&scid=d2d0f79d-60f0-5a49-8f84-784d32278109&skoid=b971d227-1348-4524-8797-edb0fdf15147&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-19T05%3A13%3A30Z&ske=2026-09-20T05%3A13%3A30Z&sks=b&skv=2026-02-06&sig=LX6RpLQ%2Brc76QTv3HwqdlINXNl/O617SzelOMJHl8F0%3D' -o preview/assets/cadoo/cadoo-08.png
          curl -fL 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-e800-8210-86b9-7efa10e4447f/raw?se=2026-09-19T19%3A29%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=22447177-992e-52a9-b867-adf15b55175c&skoid=b971d227-1348-4524-8797-edb0fdf15147&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-19T15%3A51%3A20Z&ske=2026-09-20T15%3A51%3A20Z&sks=b&skv=2026-02-06&sig=bzih/Q6aRQM3Qe6OwYAB/fF%2BN9ySoAN%2BF0EXiCd5XGA%3D' -o preview/assets/cadoo/cadoo-09.png
      - name: Commit originals to preview branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/assets/cadoo
          git diff --cached --quiet && exit 0
          git commit -m "Use original-quality Cadoo images in preview"
          git push origin HEAD:portfolio-preview
