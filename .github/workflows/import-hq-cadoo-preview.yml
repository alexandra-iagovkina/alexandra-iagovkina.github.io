name: Import HQ Cadoo preview assets

on:
  push:
    branches: [portfolio-preview]
    paths:
      - ".github/workflows/import-hq-cadoo-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-preview
      - name: Download original Cadoo PNGs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview/assets/cadoo
          curl -fL 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-7d88-8210-a5dc-d2d4f389b96e/raw?se=2026-09-19T19%3A29%3A24Z&sp=r&sv=2026-02-06&sr=b&scid=b35fc9c1-4c0a-5e65-a6c1-0750687ff65a&skoid=b971d227-1348-4524-8797-edb0fdf15147&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-19T07%3A25%3A32Z&ske=2026-09-20T07%3A25%3A32Z&sks=b&skv=2026-02-06&sig=rEQa0oWhK9JthcpUIxZ/67jfoOb4dCZImoIpzbbKt18%3D' -o preview/assets/cadoo/cadoo-10.png
