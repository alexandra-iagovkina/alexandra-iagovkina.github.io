          curl -fL 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-92b4-8210-a647-53707b2ab470/raw?se=2026-09-19T19%3A29%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=909e7ebb-ccdf-5dbb-91e8-d7c4d2d776ea&skoid=b971d227-1348-4524-8797-edb0fdf15147&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-19T09%3A25%3A23Z&ske=2026-09-20T09%3A25%3A23Z&sks=b&skv=2026-02-06&sig=LnLoJkVvqZDn5SGmbWQHEs%2Beus9dRRBtI9fNuACnr0A%3D' -o preview/assets/cadoo/cadoo-02.png
