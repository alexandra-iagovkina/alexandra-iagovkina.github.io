name: Build premium Cadoo assets

on:
  push:
    branches: [portfolio-preview]
    paths:
      - ".github/workflows/build-cadoo-premium.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-preview

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      - name: Build premium web images
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image, ImageFilter
          from pathlib import Path

          src_dir = Path("preview/assets/cadoo")
          for src in sorted(src_dir.glob("cadoo-*.png")):
              im = Image.open(src).convert("RGB")
              for width, suffix, quality, sharp in [
                  (1440, "-1440", 84, 116),
                  (800, "-800", 80, 112),
              ]:
                  h = round(im.height * width / im.width)
                  out = im.resize((width, h), Image.Resampling.LANCZOS)
                  out = out.filter(ImageFilter.UnsharpMask(radius=1.15, percent=sharp, threshold=2))
                  dest = src.with_name(src.stem + suffix + ".webp")
                  out.save(dest, "WEBP", quality=quality, method=6)
                  print(dest, dest.stat().st_size)
          PY

      - name: Commit premium assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/assets/cadoo/*-1440.webp preview/assets/cadoo/*-800.webp
          git diff --cached --quiet && exit 0
          git commit -m "Build premium Cadoo web assets"
          git push origin HEAD:portfolio-preview
