name: Import ALMONBY portfolio assets

on:
  push:
    branches: [portfolio-preview-live]
    paths:
      - "preview/assets/almonby/almonby-avif.zip"
      - ".github/workflows/import-portfolio-almonby.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-preview-live
      - name: Unpack optimized ALMONBY assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview/assets/almonby
          unzip -o -j preview/assets/almonby/almonby-avif.zip -d preview/assets/almonby
          for f in preview/assets/almonby/almonby-*.avif; do
            test "$(stat -c%s "$f")" -gt 25000
          done
          rm preview/assets/almonby/almonby-avif.zip
      - name: Commit optimized assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/assets/almonby
          git diff --cached --quiet && exit 0
          git commit -m "Add optimized ALMONBY portfolio assets"
          git push origin HEAD:portfolio-preview-live
