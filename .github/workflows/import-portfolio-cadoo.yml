          curl -fL 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-b6c0-81f4-a8ba-bbe0a40f143d/raw?se=2026-09-19T18%3A33%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=2088a0fb-4670-5a9b-a66e-3e576d0c751e&skoid=b971d227-1348-4524-8797-edb0fdf15147&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-19T15%3A33%3A38Z&ske=2026-09-20T15%3A33%3A38Z&sks=b&skv=2026-02-06&sig=iQLvVBuCAdpJI06tiynHcJ/DwIphKWewupGz2xaZ/%2Bk%3D' -o portfolio/assets/cadoo/cadoo-05.webp
          curl -fL 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-ed60-8210-8c29-21de95e256d0/raw?se=2026-09-19T18%3A33%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=eb3189c0-b96e-5ef4-9b32-677d2d797517&skoid=b971d227-1348-4524-8797-edb0fdf15147&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-19T05%3A13%3A38Z&ske=2026-09-20T05%3A13%3A38Z&sks=b&skv=2026-02-06&sig=GOE68UrE5IJq8IAsx6wHWyzbuB%2BMpSQdTl1jCP5MB24%3D' -o portfolio/assets/cadoo/cadoo-06.webp
          curl -fL 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-fe5c-81f4-99e3-967719f7948f/raw?se=2026-09-19T18%3A33%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=8ae0d7bd-b8fa-503a-8301-7162d379923e&skoid=b971d227-1348-4524-8797-edb0fdf15147&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-19T07%3A03%3A00Z&ske=2026-09-20T07%3A03%3A00Z&sks=b&skv=2026-02-06&sig=pqwyo4k96uiPyEEP51FkUdee8EGB3nA4g/JYGsp%2BhZ8%3D' -o portfolio/assets/cadoo/cadoo-07.webp
          curl -fL 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-9b58-81f4-8bfb-63289713dd02/raw?se=2026-09-19T18%3A33%3A26Z&sp=r&sv=2026-02-06&sr=b&scid=9a8a667b-7f3f-5fc2-aae0-427babbf332e&skoid=b971d227-1348-4524-8797-edb0fdf15147&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-19T06%3A49%3A45Z&ske=2026-09-20T06%3A49%3A45Z&sks=b&skv=2026-02-06&sig=R1OaH%2B4iWrBJx5exQdxsWVtvQdOGOOca/OC5%2BV%2B0ozA%3D' -o portfolio/assets/cadoo/cadoo-08.webp
          curl -fL 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-98cc-8210-b83f-58b418170d46/raw?se=2026-09-19T18%3A33%3A26Z&sp=r&sv=2026-02-06&sr=b&scid=5766bb58-e4aa-5011-9e4f-ec5f5b0c7c43&skoid=b971d227-1348-4524-8797-edb0fdf15147&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-19T18%3A18%3A45Z&ske=2026-09-20T18%3A18%3A45Z&sks=b&skv=2026-02-06&sig=iEeVbU0FAmhoMqDi/98kdUOobQgJPrHtt6ao3v2REbE%3D' -o portfolio/assets/cadoo/cadoo-09.webp
          curl -fL 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-4f18-8210-b868-1b7ae31b94f5/raw?se=2026-09-19T18%3A33%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=fc819200-aa62-5a08-a4e6-c534f7d88712&skoid=b971d227-1348-4524-8797-edb0fdf15147&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-19T05%3A45%3A28Z&ske=2026-09-20T05%3A45%3A28Z&sks=b&skv=2026-02-06&sig=%2BLySHmnRlAUkB3ZaWl8JG9Gwq1FDygbFde5gJeCowAg%3D' -o portfolio/assets/cadoo/cadoo-10.webp
          for f in portfolio/assets/cadoo/*.webp; do test "$(stat -c%s "$f")" -gt 10000; done
      - name: Commit assets
        shell: bash
        run: |
          git pull --rebase origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio/assets/cadoo
          git diff --cached --quiet && exit 0
          git commit -m "Add approved Cadoo portfolio assets"
          git push
