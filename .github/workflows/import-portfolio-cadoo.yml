          curl -fL 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-4ddc-81f4-a2e3-c1bcf7baea40/raw?se=2026-09-19T18%3A33%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=f717f9fa-80b4-5bef-be02-6ff47ef038a1&skoid=b971d227-1348-4524-8797-edb0fdf15147&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-19T07%3A21%3A26Z&ske=2026-09-20T07%3A21%3A26Z&sks=b&skv=2026-02-06&sig=Z/25O%2BDcW2RNG0BKRcr4THISonvjemCjiFTXi4dN9MI%3D' -o portfolio/assets/cadoo/cadoo-03.webp
