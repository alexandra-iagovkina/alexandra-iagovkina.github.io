name: Import portfolio Cadoo assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-portfolio-cadoo.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download approved portfolio images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p portfolio/assets/cadoo
          curl -fL 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-250c-8210-8d67-a11fceeeeae0/raw?se=2026-09-19T18%3A33%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=d08d7896-9eae-586c-b964-ec1b2dcfb035&skoid=b971d227-1348-4524-8797-edb0fdf15147&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-19T17%3A05%3A13Z&ske=2026-09-20T17%3A05%3A13Z&sks=b&skv=2026-02-06&sig=9akqi9RIAaCByXw9v7SR3Au9HRJin06gfofaXbK5zME%3D' -o portfolio/assets/cadoo/cadoo-01.webp
