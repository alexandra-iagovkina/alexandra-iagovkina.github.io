name: Build Cadoo HQ hero assets

on:
  push:
    branches: [portfolio-preview]
    paths:
      - ".github/workflows/build-cadoo-hq-hero.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-preview

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      - name: Build HQ hero WebP
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image, ImageFilter
          from pathlib import Path

          src_dir = Path("preview/assets/cadoo")
          for src in sorted(src_dir.glob("cadoo-*.png")):
              im = Image.open(src).convert("RGB")
              # Keep original dimensions for true full-width quality.
              out = im.filter(ImageFilter.UnsharpMask(radius=0.9, percent=108, threshold=2))
              dest = src.with_name(src.stem + "-hq.webp")
              out.save(dest, "WEBP", quality=92, method=6)
              print(dest, dest.stat().st_size)
          PY

      - name: Commit HQ assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/assets/cadoo/*-hq.webp
          git diff --cached --quiet && exit 0
          git commit -m "Add HQ Cadoo hero images"
          git push origin HEAD:portfolio-preview
