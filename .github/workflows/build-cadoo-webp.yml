name: Build optimized Cadoo preview images

on:
  push:
    branches: [portfolio-preview]
    paths:
      - ".github/workflows/build-cadoo-webp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-preview

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      - name: Build responsive WebP assets
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image, ImageFilter
          from pathlib import Path

          src_dir = Path("preview/assets/cadoo")
          for src in sorted(src_dir.glob("cadoo-*.png")):
              im = Image.open(src).convert("RGB")

              # Subtle portfolio-style crispness without halos.
              im = im.filter(ImageFilter.UnsharpMask(radius=1.5, percent=120, threshold=2))

              for width, suffix, quality in [
                  (1600, "", 86),
                  (960, "-960", 82),
              ]:
                  if im.width > width:
                      h = round(im.height * width / im.width)
                      out = im.resize((width, h), Image.Resampling.LANCZOS)
                  else:
                      out = im.copy()
                  dest = src.with_name(src.stem + suffix + ".webp")
                  out.save(dest, "WEBP", quality=quality, method=6)
                  print(dest, dest.stat().st_size)
          PY

      - name: Commit optimized assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/assets/cadoo/*.webp
          git diff --cached --quiet && exit 0
          git commit -m "Optimize Cadoo images for preview"
          git push origin HEAD:portfolio-preview
