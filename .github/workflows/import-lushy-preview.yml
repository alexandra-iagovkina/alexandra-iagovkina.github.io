name: Import LUSHY preview assets

on:
  push:
    branches: [portfolio-preview]
    paths:
      - ".github/workflows/import-lushy-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-preview
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Download source sprite
        run: |
          curl -L --fail --retry 3 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-d934-8210-8c08-4963e59693a6/raw?se=2026-09-20T20%3A41%3A15Z&sp=r&sv=2026-02-06&sr=b&scid=54cba9e7-0419-5091-b025-483fc04d83e1&skoid=b971d227-1348-4524-8797-edb0fdf15147&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T06%3A47%3A12Z&ske=2026-09-21T06%3A47%3A12Z&sks=b&skv=2026-02-06&sig=KQNRTV/qjp6vvpapg6UKjOwtZAAOyjZUcaaYKOj/6ZE%3D' -o /tmp/lushy-sprite.webp
      - name: Split LUSHY and polish Cadoo HQ
        run: |
          python - <<'PY'
          from PIL import Image, ImageFilter
          from pathlib import Path
          src = Image.open("/tmp/lushy-sprite.webp").convert("RGB")
          w = 1672
          h = 941
          out_dir = Path("preview/assets/lushy")
          out_dir.mkdir(parents=True, exist_ok=True)
          for i in range(9):
              frame = src.crop((0, i*h, w, (i+1)*h))
              hq = frame.filter(ImageFilter.UnsharpMask(radius=1.1, percent=120, threshold=2))
              hq.save(out_dir/f"lushy-{i+1:02d}-hq.webp", "WEBP", quality=93, method=6)
              sm = frame.resize((800, round(h*800/w)), Image.Resampling.LANCZOS)
              sm = sm.filter(ImageFilter.UnsharpMask(radius=1.0, percent=116, threshold=2))
              sm.save(out_dir/f"lushy-{i+1:02d}-800.webp", "WEBP", quality=81, method=6)

          for png in sorted(Path("preview/assets/cadoo").glob("cadoo-??.png")):
              im = Image.open(png).convert("RGB")
              out = im.filter(ImageFilter.UnsharpMask(radius=1.2, percent=128, threshold=2))
              out.save(png.with_name(png.stem+"-hq.webp"), "WEBP", quality=94, method=6)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/assets/lushy preview/assets/cadoo/*-hq.webp
          git diff --cached --quiet && exit 0
          git commit -m "Add LUSHY assets and sharpen Cadoo heroes"
          git push origin HEAD:portfolio-preview
