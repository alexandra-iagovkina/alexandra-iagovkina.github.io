<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Aleksandra Iagovkina — Portfolio Preview</title>
<meta name="description" content="Independent multidisciplinary designer and art director working across brand identity, graphic design, UI/UX and web."/>
<link rel="icon" href="../portfolio/assets/logo.png"/>
<style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap');


:root {
  --bg: #0a0a0a;
  --fg: #f2efea;
  --muted: #8d8d8d;
  --line: rgba(255,255,255,.14);
}

html {
  background: var(--bg);
  color: var(--fg);
  font-family: "DM Sans", sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  background:
    radial-gradient(1200px 800px at 65% 35%, rgba(255,255,255,.018), transparent 70%),
    linear-gradient(145deg, rgba(255,255,255,.012), transparent 45%),
    #0a0a0a;
}

* { box-sizing: border-box; }
a { color: inherit; text-decoration: none; }
::selection { background:#f2efea; color:#0a0a0a; }

.site-shell { width:min(1370px, calc(100% - 48px)); margin:0 auto; }

.target-header {
  position: fixed; inset: 0 0 auto 0; z-index: 50;
  padding: 28px 24px 0;
  mix-blend-mode: normal;
}
.target-header-inner {
  width:min(1810px, calc(100% - 0px)); margin:0 auto;
  display:flex; align-items:center; justify-content:space-between;
}
.target-brand {
  display:flex;
  align-items:center;
  width:52px;
  height:32px;
  line-height:1;
}
.target-brand-mark {
  display:block;
  width:52px;
  height:32px;
  object-fit:contain;
}
.target-nav { display:flex; gap:36px; align-items:center; }
.target-nav a {
  font-size:12px; letter-spacing:.12em; text-transform:uppercase;
  transition:opacity .2s ease;
}
.target-nav a:hover { opacity:.55; }

.hero-target {
  min-height:100svh;
  display:flex;
  align-items:flex-end;
  padding:120px 24px 64px;
}
.hero-target-inner { width:min(1370px, calc(100% - 0px)); margin:0 auto; }
.hero-target h1 {
  margin:0;
  max-width:1120px;
  font-family:"Playfair Display", serif;
  font-weight:400;
  font-size:clamp(72px, 7.9vw, 148px);
  line-height:.83;
  letter-spacing:-.055em;
  text-transform:uppercase;
}
.hero-rule { height:1px; background:var(--line); margin-top:44px; }
.hero-bottom {
  display:grid;
  grid-template-columns:minmax(0, 1fr) 280px;
  gap:48px;
  padding-top:28px;
  align-items:end;
}
.hero-copy {
  max-width:470px;
  font-size:18px;
  line-height:1.45;
  letter-spacing:-.025em;
}
.hero-copy .muted { color:#777; }
.hero-scroll {
  justify-self:end;
  font-size:10px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:#777;
  padding-bottom:4px;
}

.section-target { padding:150px 24px; border-top:1px solid var(--line); }
.section-kicker { font-size:11px; letter-spacing:.15em; text-transform:uppercase; color:#8d8d8d; }
.section-title {
  margin:16px 0 70px;
  font-family:"Playfair Display", serif;
  font-size:clamp(54px, 6vw, 112px);
  line-height:.92; font-weight:400; letter-spacing:-.045em;
  text-transform:uppercase;
}

.work-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:86px 28px; }
.work-card { display:block; }
.work-media {
  width:100%;
  aspect-ratio:16/10;
  background:#111;
  overflow:hidden;
}
.work-media img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .5s cubic-bezier(.2,.7,.2,1); }
.work-card:hover .work-media img { transform:scale(1.012); }
.work-placeholder {
  width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  border:1px solid rgba(255,255,255,.07);
  color:#3e3e3e; font-family:"Playfair Display",serif; font-size:40px;
}
.work-placeholder small {
  font-family:"DM Sans",sans-serif;
  font-size:9px;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:#555;
}
.work-meta {
  margin-top:18px; display:flex; justify-content:space-between; gap:24px; align-items:baseline;
  border-top:1px solid rgba(255,255,255,.12); padding-top:14px;
}
.work-title { font-family:"Playfair Display",serif; font-size:30px; }
.work-num { font-size:10px; letter-spacing:.15em; color:#777; }

.about-target { display:grid; grid-template-columns:1fr 1.35fr; gap:100px; align-items:start; }
.about-target h2 {
  margin:0; font-family:"Playfair Display",serif; font-size:clamp(64px,7vw,126px);
  font-weight:400; line-height:.88; letter-spacing:-.05em; text-transform:uppercase;
}
.about-copy { font-size:28px; line-height:1.35; letter-spacing:-.035em; }
.about-copy p { margin:0 0 30px; }
.about-copy .small { font-size:17px; line-height:1.55; color:#8d8d8d; max-width:700px; }

.contact-target { min-height:72vh; display:flex; align-items:flex-end; }
.contact-target h2 {
  margin:0;
  font-family:"Playfair Display",serif;
  font-size:clamp(64px,8vw,150px);
  line-height:.85; font-weight:400; letter-spacing:-.05em; text-transform:uppercase;
}
.contact-links { margin-top:46px; display:flex; gap:34px; flex-wrap:wrap; font-size:11px; letter-spacing:.14em; text-transform:uppercase; }

.case-page { padding:150px 24px 90px; }
.case-top { width:min(1370px,100%); margin:0 auto; }
.case-back { font-size:10px; letter-spacing:.15em; text-transform:uppercase; color:#888; }
.case-title {
  margin:74px 0 46px;
  font-family:"Playfair Display",serif;
  font-size:clamp(74px,9vw,164px);
  line-height:.84; font-weight:400; letter-spacing:-.055em; text-transform:uppercase;
}
.case-intro {
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  padding:30px 0 38px;
  display:grid;
  grid-template-columns:repeat(3, minmax(0,1fr));
  gap:40px;
}
.case-fact dt, .case-description-label {
  margin:0 0 12px; font-size:10px; letter-spacing:.15em; text-transform:uppercase; color:#777;
}
.case-fact dd { margin:0; min-height:30px; font-size:16px; }
.case-description {
  display:grid; grid-template-columns:1fr 2fr; gap:80px;
  padding:72px 0 104px;
}
.case-description-copy {
  min-height:150px;
  border-top:1px solid rgba(255,255,255,.09);
  padding-top:18px;
  color:#8d8d8d;
  font-size:17px; line-height:1.6;
}
.case-description-copy p { margin:0 0 22px; }
.case-description-copy p:last-child { margin-bottom:0; }
.case-gallery { width:min(1600px, calc(100% - 32px)); margin:0 auto; display:flex; flex-direction:column; gap:20px; }
.case-shot { width:100%; background:#111; }
.case-shot img { width:100%; height:auto; display:block; image-rendering:auto; }
.case-placeholder {
  aspect-ratio:16/9; border:1px solid rgba(255,255,255,.08);
  display:flex; align-items:flex-end; justify-content:flex-end; padding:18px;
  color:#343434; font-size:10px; letter-spacing:.15em; text-transform:uppercase;
}
.case-nav {
  width:min(1370px, calc(100% - 48px)); margin:90px auto 0;
  padding-top:28px; border-top:1px solid var(--line);
  display:flex; justify-content:space-between; gap:24px;
  font-size:10px; letter-spacing:.13em; text-transform:uppercase;
}
.case-nav span { font-family:"Playfair Display",serif; font-size:24px; text-transform:none; letter-spacing:0; margin-left:8px; }

@media (max-width: 800px) {
  .target-header { padding:20px 16px 0; }
  .target-brand { width:42px; height:26px; }
  .target-brand-mark { width:42px; height:26px; }
  .target-nav { gap:18px; }
  .target-nav a { font-size:9px; }
  .hero-target { padding:100px 16px 32px; }
  .hero-target h1 { font-size:clamp(58px,17vw,96px); }
  .hero-rule { margin-top:28px; }
  .hero-bottom { grid-template-columns:1fr; gap:28px; }
  .hero-copy { font-size:15px; }
  .hero-scroll { justify-self:start; }
  .section-target { padding:100px 16px; }
  .work-grid { grid-template-columns:1fr; gap:62px; }
  .about-target { grid-template-columns:1fr; gap:52px; }
  .about-copy { font-size:24px; }
  .case-page { padding:120px 16px 70px; }
  .case-intro { grid-template-columns:1fr; gap:26px; }
  .case-description { grid-template-columns:1fr; gap:18px; padding:54px 0 72px; }
  .case-gallery { width:calc(100% - 16px); gap:10px; }
  .case-nav { width:calc(100% - 32px); }
}

html,body,#app{min-height:100%}
.work-placeholder strong{font-family:"Playfair Display",serif;font-size:clamp(28px,2.6vw,48px);font-weight:400;letter-spacing:-.035em;color:#555;text-align:center;padding:0 24px}
.work-placeholder span{font-size:12px;letter-spacing:.18em;color:#3f3f3f}
.route-fade{animation:routeFade .24s ease both}
@keyframes routeFade{from{opacity:.35}to{opacity:1}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const projects=[
{id:"1",slug:"cadoo",number:"01",title:"Cadoo",thumbnail:"../portfolio/assets/cadoo/cadoo-03.webp",gallery:Array.from({length:10},function(_,i){return "../portfolio/assets/cadoo/cadoo-"+String(i+1).padStart(2,"0")+".webp"}),duration:"Independent Brand Project",role:"Art Direction · Brand Identity · Packaging · Visual System",scope:"Naming · Logo · Mascot · Packaging · Campaign Visuals · Social Media · Brand Applications",description:["Cadoo is a complete cat-care brand identity built from the ground up, from naming and visual language to packaging, campaign imagery and brand applications. The system centers on a character-driven mascot and a flexible color architecture that allows product lines, flavours and formats to feel distinct while remaining unmistakably part of one brand.","I developed the creative direction, identity, packaging system and art direction across food, treats, accessories, social media and outdoor communication, creating a playful but commercially polished world designed to scale across physical and digital touchpoints."]},
{id:"2",slug:"lushy",number:"02",title:"LUSHY",gallery:[null,null,null],duration:"—",role:"—",scope:"—",description:["Case study details will be added here."]},
{id:"3",slug:"system-integrator",number:"03",title:"System Integrator",gallery:[null,null,null],duration:"—",role:"—",scope:"—",description:["Case study details will be added here."]},
{id:"4",slug:"industrial-asphalt-plant",number:"04",title:"Industrial / Asphalt Plant",gallery:[null,null,null],duration:"—",role:"—",scope:"—",description:["Case study details will be added here."]},
{id:"5",slug:"bsh-uae-town-hall",number:"05",title:"BSH UAE Town Hall",gallery:[null,null,null],duration:"—",role:"—",scope:"—",description:["Case study details will be added here."]},
{id:"6",slug:"maree",number:"06",title:"MARÉE",gallery:[null,null,null],duration:"—",role:"—",scope:"—",description:["Case study details will be added here."]},
{id:"7",slug:"coqbuy",number:"07",title:"Coqbuy",gallery:[null,null,null],duration:"—",role:"—",scope:"—",description:["Case study details will be added here."]},
{id:"8",slug:"banking-service",number:"08",title:"Banking Service",gallery:[null,null,null],duration:"—",role:"—",scope:"—",description:["Case study details will be added here."]},
{id:"9",slug:"state-award-digital-exhibition",number:"09",title:"State Award / Digital Exhibition",gallery:[null,null,null],duration:"—",role:"—",scope:"—",description:["Case study details will be added here."]},
{id:"10",slug:"lauren-website",number:"10",title:"Lauren Website",gallery:[null,null,null],duration:"—",role:"—",scope:"—",description:["Case study details will be added here."]}
];
const app=document.getElementById("app");
function esc(s){return String(s).replace(/[&<>"\']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","\'":"&#039;"}[m]})}
function nav(){return '<header class="target-header"><div class="target-header-inner"><a href="#" class="target-brand js-home" aria-label="Aleksandra Iagovkina — Home"><img src="../portfolio/assets/logo.png" alt="" class="target-brand-mark"/></a><nav class="target-nav" aria-label="Primary"><a href="#work" data-home-target="#work">Work</a><a href="#about" data-home-target="#about">About</a><a href="#contact" data-home-target="#contact">Contact</a></nav></div></header>'}
function home(){var cards=projects.map(function(p){var media=p.thumbnail?'<img src="'+p.thumbnail+'" alt="'+esc(p.title)+'" loading="lazy"/>':'<div class="work-placeholder"><span>'+p.number+'</span><strong>'+esc(p.title)+'</strong><small>Visual coming soon</small></div>';return '<a href="#/work/'+p.slug+'" data-project="'+p.slug+'" class="work-card"><div class="work-media">'+media+'</div><div class="work-meta"><div class="work-title">'+esc(p.title)+'</div><div class="work-num">'+p.number+'</div></div></a>'}).join("");return nav()+'<main class="route-fade"><section class="hero-target"><div class="hero-target-inner"><h1>Aleksandra<br/>Iagovkina</h1><div class="hero-rule"></div><div class="hero-bottom"><p class="hero-copy"><span class="muted">Art Director &amp; Designer. </span>Creating precise identity systems from first mark through real-world applications.</p><div class="hero-scroll">Scroll to explore</div></div></div></section><section id="work" class="section-target"><div class="site-shell"><div class="section-kicker">Work</div><h2 class="section-title">Selected Projects</h2><div class="work-grid">'+cards+'</div></div></section><section id="about" class="section-target"><div class="site-shell about-target"><h2>About</h2><div class="about-copy"><p>Independent multidisciplinary designer and art director working across brand identity, graphic design, UI/UX and web. My focus today is increasingly on creative direction: defining the idea, visual language and system behind a project, then guiding it from concept to final execution.</p><p class="small">I lead the creative process, make key visual decisions, structure the work and maintain consistency across every touchpoint. Where appropriate, I delegate production and technical execution to junior designers while retaining art direction, review and quality control. This allows me to focus on concept, direction, decision-making and the overall coherence of the project.</p></div></div></section><section id="contact" class="section-target contact-target"><div class="site-shell"><div class="section-kicker">Contact</div><h2>Have a project<br/>in mind?</h2><div class="contact-links"><a href="https://t.me/twelveeyed" target="_blank" rel="noreferrer">Telegram</a><a href="https://wa.me/79967151380" target="_blank" rel="noreferrer">WhatsApp</a><a href="mailto:aleksandra.iagovkina@gmail.com">Email</a></div></div></section></main>'}
function projectPage(p){var idx=projects.findIndex(function(x){return x.slug===p.slug});var prev=projects[(idx-1+projects.length)%projects.length];var next=projects[(idx+1)%projects.length];var gallery=p.gallery.map(function(img,i){return '<div class="case-shot">'+(img?'<img src="'+img+'" alt="'+esc(p.title)+' project image '+(i+1)+'" loading="'+(i<2?"eager":"lazy")+'" decoding="async"/>':'<div class="case-placeholder">Image '+String(i+1).padStart(2,"0")+'</div>')+'</div>'}).join("");var desc=p.description.map(function(t){return '<p>'+esc(t)+'</p>'}).join("");return nav()+'<article class="case-page route-fade"><div class="case-top"><a href="#work" data-home-target="#work" class="case-back">← Back to work</a><h1 class="case-title">'+esc(p.title)+'</h1><dl class="case-intro"><div class="case-fact"><dt>Duration</dt><dd>'+esc(p.duration)+'</dd></div><div class="case-fact"><dt>What I did</dt><dd>'+esc(p.role)+'</dd></div><div class="case-fact"><dt>Scope</dt><dd>'+esc(p.scope)+'</dd></div></dl><div class="case-description"><div class="case-description-label">Project description</div><div class="case-description-copy">'+desc+'</div></div></div><div class="case-gallery">'+gallery+'</div><nav class="case-nav"><a href="#/work/'+prev.slug+'" data-project="'+prev.slug+'">Previous <span>'+esc(prev.title)+'</span></a><a href="#/work/'+next.slug+'" data-project="'+next.slug+'">Next <span>'+esc(next.title)+'</span></a></nav></article>'}
function render(){var m=location.hash.match(/^#\/work\/([^/]+)\/?$/);if(m){var p=projects.find(function(x){return x.slug===m[1]});app.innerHTML=p?projectPage(p):home()}else{app.innerHTML=home()}bind()}
function toHome(target){location.hash=target;render();requestAnimationFrame(function(){var el=document.querySelector(target);if(el)el.scrollIntoView({behavior:"smooth"})})}
function bind(){document.querySelectorAll("[data-project]").forEach(function(a){a.addEventListener("click",function(e){e.preventDefault();location.hash="/work/"+a.getAttribute("data-project");window.scrollTo(0,0)})});document.querySelectorAll("[data-home-target]").forEach(function(a){a.addEventListener("click",function(e){e.preventDefault();toHome(a.getAttribute("data-home-target"))})});document.querySelectorAll(".js-home").forEach(function(a){a.addEventListener("click",function(e){e.preventDefault();location.hash="";window.scrollTo(0,0);render()})})}
window.addEventListener("hashchange",function(){render();if(location.hash && !location.hash.startsWith("#/work/")){setTimeout(function(){var el=document.querySelector(location.hash);if(el)el.scrollIntoView()},0)}else{window.scrollTo(0,0)}});render();if(location.hash&&!location.hash.startsWith("#/work/")){setTimeout(function(){var el=document.querySelector(location.hash);if(el)el.scrollIntoView()},0)}
</script>

</html>
