<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Aleksandra Iagovkina — Venture-to-Brand Strategist · Creative Director</title>
<meta name="description" content="Venture-to-Brand Strategist and Creative Director helping people define what should exist before designing how it should look."/>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png">
<style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap');


:root {
  --bg: #0a0a0a;
  --fg: #f2efea;
  --muted: #8d8d8d;
  --line: rgba(255,255,255,.14);
  --accent: #ad0026;
}

html {
  background: var(--bg);
  color: var(--fg);
  font-family: "DM Sans", sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  background:
    radial-gradient(1200px 800px at 65% 35%, rgba(255,255,255,.018), transparent 70%),
    linear-gradient(145deg, rgba(255,255,255,.012), transparent 45%),
    #0a0a0a;
}

* { box-sizing: border-box; }
a { color: inherit; text-decoration: none; }
::selection { background:#f2efea; color:#0a0a0a; }

.site-shell { width:min(1370px, calc(100% - 48px)); margin:0 auto; }

.target-header {
  position: fixed; inset: 0 0 auto 0; z-index: 50;
  padding: 0 24px;
  background: rgba(10,10,10,.54);
  border-bottom: 1px solid rgba(255,255,255,.09);
  -webkit-backdrop-filter: blur(18px) saturate(145%);
  backdrop-filter: blur(18px) saturate(145%);
  box-shadow: 0 10px 35px rgba(0,0,0,.16);
  mix-blend-mode: normal;
}
.target-header-inner {
  width:min(1810px, calc(100% - 0px)); margin:0 auto;
  min-height:72px;
  display:flex; align-items:center; justify-content:space-between;
}
.target-brand {
  display:flex;
  align-items:center;
  width:52px;
  height:32px;
  line-height:1;
}
.target-brand-mark {
  display:block;
  width:52px;
  height:32px;
  object-fit:contain;
}
.target-nav { display:flex; gap:36px; align-items:center; }
.target-nav a {
  font-size:12px; letter-spacing:.12em; text-transform:uppercase;
  transition:color .25s ease, opacity .25s ease;
}
.target-nav a:hover { color:var(--accent); opacity:1; }

.hero-target {
  min-height:100svh;
  display:flex;
  align-items:flex-end;
  padding:120px 24px 64px;
}
.hero-target-inner { width:min(1370px, calc(100% - 0px)); margin:0 auto; }
.hero-target h1 {
  margin:0;
  max-width:1120px;
  font-family:"Playfair Display", serif;
  font-weight:400;
  font-size:clamp(72px, 7.9vw, 148px);
  line-height:.83;
  letter-spacing:-.055em;
  text-transform:uppercase;
}
.hero-rule { height:1px; background:var(--line); margin-top:44px; }
.hero-bottom {
  display:grid;
  grid-template-columns:minmax(0, 1fr) 280px;
  gap:48px;
  padding-top:28px;
  align-items:end;
}
.hero-copy {
  max-width:470px;
  font-size:18px;
  line-height:1.45;
  letter-spacing:-.025em;
}
.hero-copy .muted { color:#777; }
.hero-scroll {
  justify-self:end;
  font-size:10px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:#777;
  padding-bottom:4px;
}

.section-target { padding:150px 24px; border-top:1px solid var(--line); }
.section-kicker { font-size:11px; letter-spacing:.15em; text-transform:uppercase; color:#8d8d8d; }
.section-title {
  margin:16px 0 70px;
  font-family:"Playfair Display", serif;
  font-size:clamp(54px, 6vw, 112px);
  line-height:.92; font-weight:400; letter-spacing:-.045em;
  text-transform:uppercase;
}

.work-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:86px 28px; }
.work-card { display:block; }
.work-media {
  width:100%;
  aspect-ratio:16/10;
  background:#111;
  overflow:hidden;
}
.work-media img {
  width:100%; height:100%; object-fit:cover; display:block;
  filter:contrast(1.018) saturate(1.008);
  transition:transform .5s cubic-bezier(.2,.7,.2,1), filter .35s ease;
  transform:translateZ(0);
}
.work-card:hover .work-media img { transform:scale(1.012); }
.work-placeholder {
  width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  border:1px solid rgba(255,255,255,.07);
  color:#3e3e3e; font-family:"Playfair Display",serif; font-size:40px;
}
.work-placeholder small {
  font-family:"DM Sans",sans-serif;
  font-size:9px;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:#555;
}
.work-meta {
  margin-top:18px; display:flex; justify-content:space-between; gap:24px; align-items:baseline;
  border-top:1px solid rgba(255,255,255,.12); padding-top:14px;
}
.work-title { font-family:"Playfair Display",serif; font-size:30px; transition:color .28s ease; }
.work-card:hover .work-title { color:var(--accent); }
.work-num { font-size:10px; letter-spacing:.15em; color:#777; }

.about-target { display:grid; grid-template-columns:1fr 1.35fr; gap:100px; align-items:start; }
.about-target h2 {
  margin:0; font-family:"Playfair Display",serif; font-size:clamp(64px,7vw,126px);
  font-weight:400; line-height:.88; letter-spacing:-.05em; text-transform:uppercase;
}
.about-copy { font-size:28px; line-height:1.35; letter-spacing:-.035em; }
.about-copy p { margin:0 0 30px; }
.about-copy .small { font-size:17px; line-height:1.55; color:#8d8d8d; max-width:700px; }

.contact-target { min-height:72vh; display:flex; align-items:flex-end; }
.contact-target h2 {
  margin:0;
  font-family:"Playfair Display",serif;
  font-size:clamp(64px,8vw,150px);
  line-height:.85; font-weight:400; letter-spacing:-.05em; text-transform:uppercase;
}
.contact-links { margin-top:46px; display:flex; gap:34px; flex-wrap:wrap; font-size:11px; letter-spacing:.14em; text-transform:uppercase; }
.contact-links a,
.case-back,
.case-nav a { transition:color .25s ease, opacity .25s ease; }
.contact-links a:hover,
.case-back:hover,
.case-nav a:hover { color:var(--accent); opacity:1; }

.case-page { padding:150px 24px 90px; }
.case-top { width:min(1370px,100%); margin:0 auto; }
.case-back { font-size:10px; letter-spacing:.15em; text-transform:uppercase; color:#888; }
.case-title {
  margin:74px 0 46px;
  font-family:"Playfair Display",serif;
  font-size:clamp(74px,9vw,164px);
  line-height:.84; font-weight:400; letter-spacing:-.055em; text-transform:uppercase;
}
.case-intro {
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  padding:30px 0 38px;
  display:grid;
  grid-template-columns:repeat(3, minmax(0,1fr));
  gap:40px;
}
.case-fact dt, .case-description-label {
  margin:0 0 12px; font-size:10px; letter-spacing:.15em; text-transform:uppercase; color:#777;
}
.case-fact dd { margin:0; min-height:30px; font-size:16px; }
.case-description {
  display:grid; grid-template-columns:1fr 2fr; gap:80px;
  padding:72px 0 104px;
}
.case-description-copy {
  min-height:150px;
  border-top:1px solid rgba(255,255,255,.09);
  padding-top:18px;
  color:#8d8d8d;
  font-size:17px; line-height:1.6;
}
.case-description-copy p { margin:0 0 22px; }
.case-description-copy p:last-child { margin-bottom:0; }
.case-gallery { width:min(1600px, calc(100% - 32px)); margin:0 auto; display:flex; flex-direction:column; gap:20px; }
.case-flow {
  width:min(1600px, calc(100% - 32px));
  margin:0 auto;
  display:flex;
  flex-direction:column;
  gap:0;
}
.case-flow-item { width:100%; }
.case-media { min-width:0; }
.case-media--full { width:100%; }
.case-media--medium { width:min(1220px, 82%); margin:0 auto; }
.case-media--narrow { width:min(1040px, 70%); margin:0 auto; }
.case-shot {
  width:100%;
  background:#0f0f0f;
  overflow:hidden;
  content-visibility:auto;
  contain-intrinsic-size:1600px 900px;
  box-shadow:0 18px 55px rgba(0,0,0,.22);
}
.case-shot img {
  width:100%;
  height:auto;
  display:block;
  image-rendering:auto;
  filter:contrast(1.025) saturate(1.008);
  transform:translateZ(0);
}
.case-caption {
  margin-top:12px;
  padding:0 2px;
  max-width:680px;
  color:#85817d;
  font-size:9px;
  line-height:1.55;
  letter-spacing:.11em;
  text-transform:uppercase;
}
.case-pair {
  display:grid;
  gap:22px;
  align-items:start;
  margin:30px 0 96px;
}
.case-pair--even { grid-template-columns:repeat(2,minmax(0,1fr)); }
.case-pair--asym-left { grid-template-columns:minmax(0,1.22fr) minmax(0,.78fr); }
.case-pair--asym-right { grid-template-columns:minmax(0,.78fr) minmax(0,1.22fr); }
.case-pair > div { min-width:0; }
.case-text-block {
  width:min(1320px, calc(100% - 96px));
  margin:104px auto 98px;
  padding-top:38px;
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:minmax(160px,.48fr) minmax(0,1.52fr);
  gap:84px;
}
.case-text-kicker,
.case-feature-kicker,
.case-closing-kicker {
  font-size:10px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:#777;
}
.case-text-content h3,
.case-feature-copy h3 {
  margin:0 0 24px;
  max-width:820px;
  font-family:"Playfair Display",serif;
  font-weight:400;
  font-size:clamp(44px,4.5vw,76px);
  line-height:.96;
  letter-spacing:-.045em;
}
.case-text-content p,
.case-feature-copy p {
  margin:0 0 21px;
  max-width:820px;
  color:#9b9792;
  font-size:18px;
  line-height:1.72;
}
.case-feature {
  width:min(1420px, calc(100% - 64px));
  margin:104px auto;
  display:grid;
  grid-template-columns:minmax(0,1.38fr) minmax(360px,.62fr);
  gap:74px;
  align-items:center;
}
.case-feature--image-right {
  grid-template-columns:minmax(360px,.62fr) minmax(0,1.38fr);
}
.case-feature--image-right .case-feature-media { order:2; }
.case-feature--image-right .case-feature-copy { order:1; }
.case-feature-copy {
  padding:34px 0;
  border-top:1px solid var(--line);
  border-bottom:1px solid rgba(255,255,255,.06);
}
.case-feature-kicker { margin-bottom:24px; }
.case-feature-copy h3 { font-size:clamp(38px,3.8vw,64px); }
.case-feature-copy p { font-size:16px; line-height:1.7; }
.case-quote {
  width:min(1280px, calc(100% - 96px));
  margin:106px auto;
  padding:64px 0 68px;
  border-top:1px solid rgba(255,255,255,.15);
  border-bottom:1px solid rgba(255,255,255,.09);
  text-align:center;
}
.case-quote p {
  margin:0 auto;
  max-width:1040px;
  font-family:"Playfair Display",serif;
  font-weight:400;
  font-size:clamp(42px,5vw,80px);
  line-height:1.01;
  letter-spacing:-.05em;
}
.case-closing {
  width:min(1320px, calc(100% - 96px));
  margin:112px auto 44px;
  padding:44px 0 12px;
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:minmax(160px,.48fr) minmax(0,1.52fr);
  gap:84px;
}
.case-closing h3 {
  margin:0 0 24px;
  font-family:"Playfair Display",serif;
  font-weight:400;
  font-size:clamp(48px,5.2vw,88px);
  line-height:.94;
  letter-spacing:-.05em;
}
.case-closing p {
  margin:0;
  max-width:860px;
  color:#9b9792;
  font-size:19px;
  line-height:1.72;
}
.case-placeholder {
  aspect-ratio:16/9; border:1px solid rgba(255,255,255,.08);
  display:flex; align-items:flex-end; justify-content:flex-end; padding:18px;
  color:#343434; font-size:10px; letter-spacing:.15em; text-transform:uppercase;
}
.case-nav {
  width:min(1370px, calc(100% - 48px)); margin:90px auto 0;
  padding-top:28px; border-top:1px solid var(--line);
  display:flex; justify-content:space-between; gap:24px;
  font-size:10px; letter-spacing:.13em; text-transform:uppercase;
}
.case-nav span { font-family:"Playfair Display",serif; font-size:24px; text-transform:none; letter-spacing:0; margin-left:8px; }

.reveal {
  opacity:0;
  transform:translateY(24px);
  transition:
    opacity .72s cubic-bezier(.22,.61,.36,1),
    transform .72s cubic-bezier(.22,.61,.36,1);
  transition-delay:var(--reveal-delay,0ms);
  will-change:opacity,transform;
}
.reveal.is-visible {
  opacity:1;
  transform:translateY(0);
}
@media (prefers-reduced-motion: reduce) {
  .reveal,
  .reveal.is-visible {
    opacity:1;
    transform:none;
    transition:none;
  }
}

html,body,#app{min-height:100%}
html{scroll-padding-top:88px}
img{max-width:100%}
#work,#about,#contact{scroll-margin-top:88px}
.work-placeholder strong{font-family:"Playfair Display",serif;font-size:clamp(28px,2.6vw,48px);font-weight:400;letter-spacing:-.035em;color:#555;text-align:center;padding:0 24px}

/* Final art-direction pass — typography, accents, journey, forms */

.stage-card .num,
.service-card .num,
.value-card .num,

.method-step-label,

/* Method journey: one continuous route, not anonymous boxes */
.method-journey{
  position:relative;
  width:min(1260px,100%);
  margin:34px auto 30px;
  padding:34px 0;
}
.method-journey-line{
  position:absolute;
  top:0;
  bottom:0;
  left:50%;
  width:1px;
  transform:translateX(-50%);
  background:linear-gradient(to bottom,transparent 0,var(--accent) 5%,var(--accent) 95%,transparent 100%);
  opacity:.72;
}
.method-step{
  position:relative;
  display:grid;
  grid-template-columns:minmax(0,1fr) 92px minmax(0,1fr);
  align-items:center;
  min-height:230px;
  padding:34px 0;
  border:0;
}
.method-step::before{
  content:"";
  position:absolute;
  top:50%;
  width:calc(50% - 46px);
  height:1px;
  background:linear-gradient(90deg,rgba(173,0,38,.08),rgba(173,0,38,.7));
}
.method-step--left::before{left:0}
.method-step--right::before{
  right:0;
  transform:scaleX(-1);
}
.method-step-content{
  max-width:510px;
  min-width:0;
}
.method-step--left .method-step-content{
  grid-column:1;
  justify-self:end;
  padding-right:42px;
  text-align:right;
}
.method-step--right .method-step-content{
  grid-column:3;
  justify-self:start;
  padding-left:42px;
}
.method-step--left .method-step-node{grid-column:2}
.method-step--right .method-step-node{grid-column:2;grid-row:1}
.method-step--right .method-step-spacer{grid-column:1;grid-row:1}
.method-step-node{
  z-index:2;
  width:58px;
  height:58px;
  justify-self:center;
  display:grid;
  place-items:center;
  border:1px solid var(--accent);
  border-radius:50%;
  background:#0a0a0a;
  box-shadow:0 0 0 10px #0a0a0a;
}
.method-step-node span{
  color:var(--accent);
  font-size:10px;
  letter-spacing:.14em;
}
.method-step-label{
  margin-bottom:16px;
  font-size:9px;
  letter-spacing:.16em;
  text-transform:uppercase;
}
.method-step h3{
  margin:0 0 15px;

  font-size:clamp(34px,3vw,48px);
  line-height:1.03;
  letter-spacing:-.035em;
}

  font-size:15px;
  line-height:1.68;
}

/* Existing home process gets clearer accents without turning into a second timeline */
.path-step{
  position:relative;
  transition:border-color .25s ease,background .25s ease;
}
.path-step::after{
  content:"→";
  position:absolute;
  right:22px;
  top:20px;
  color:var(--accent);
  font-size:18px;
  opacity:.72;
}
.path-step:last-child::after{content:"•"}

  '<section class="editorial-section"><div class="editorial-inner"><div class="editorial-head"><div class="editorial-kicker">Philosophy</div><div><h2>A profitable idea is not automatically the right idea.</h2><p class="editorial-lead">I am interested in the overlap between what can work commercially and what a person can genuinely see themselves building for years.</p></div></div><div class="value-grid"><div class="value-card"><div class="num">01</div><h3>Can you sustain it?</h3><p>The business should fit the life, energy and working style of the person who has to run it.</p></div><div class="value-card"><div class="num">02</div><h3>Are you good at it?</h3><p>We look for directions that use real strengths rather than forcing a fashionable niche.</p></div><div class="value-card"><div class="num">03</div><h3>Does anyone need it?</h3><p>Personal fit still has to meet a real audience, a useful offer and strategic logic.</p></div><div class="value-card"><div class="num">04</div><h3>Can it grow with you?</h3><p>The concept should leave room for evolution rather than locking you into a role you will outgrow.</p></div></div></div></section>'+

function servicesPage(){return nav()+'<main class="page-view route-fade"><div class="page-shell"><div class="page-kicker">Services</div><h1 class="page-title">Start Where You Are</h1><div class="page-intro"><div class="editorial-kicker">How we can work</div><p>You can come with a business, an early idea or simply the feeling that you want to create something of your own. The scope begins with the question you actually need answered.</p></div>'+
'<section class="service-detail"><h3>Direction &amp; Potential</h3><div class="service-detail-copy"><p>For people who want to build something of their own but do not yet know which direction fits. We map strengths, interests, motivations, working style, resources and constraints, then identify business territories worth exploring.</p><div class="deliverables"><span class="pill">Deep consultation</span><span class="pill">Strengths &amp; patterns</span><span class="pill">Possible directions</span><span class="pill">Fit &amp; constraints</span><span class="pill">Next-step recommendations</span></div></div></section>'+

'<section class="service-detail"><h3>Full Concept-to-Brand</h3><div class="service-detail-copy"><p>The flagship engagement. We can begin at “I know I want something of my own” and move all the way through business direction, concept, positioning, naming, identity and the visual ecosystem around it.</p><div class="deliverables"><span class="pill">Personal discovery</span><span class="pill">Business direction</span><span class="pill">Concept</span><span class="pill">Naming</span><span class="pill">Strategy</span><span class="pill">Identity</span><span class="pill">Creative direction</span></div>'+routeLink("#/start-a-project","Discuss a project","btn-primary")+'</div></section>'+'<section class="page-section statement-section"><div class="statement-layout"><div class="editorial-kicker">Execution &amp; handoff</div><div><h2 class="statement-title">Clear ownership<br/>from idea to production.</h2><p class="statement-copy">I stay closely involved through design, technical preparation and handoff, while specialist production work is handled by the appropriate expert when needed.</p></div></div><div class="scope-grid"><div class="scope-card"><h3>What I handle</h3><p>I can take the project from concept through the complete visual system and prepare it properly for real-world use.</p><div class="scope-list"><div class="scope-item">Brand strategy, naming, identity and creative direction</div><div class="scope-item">Website UX/UI and visual design, including simple micro-interactions and light interface motion</div><div class="scope-item">Packaging, print layouts and production-ready artwork</div><div class="scope-item">Technical print preparation: bleeds, colour setup, dielines, export specifications and proof corrections</div><div class="scope-item">Direct communication with your selected print house to resolve production details and protect design quality</div></div></div><div class="scope-card"><h3>Specialist handoff</h3><p>Some production disciplines sit outside my scope. function methodPage(){var steps=[["01","Understand the person","Strengths, interests, experience, motivations, lifestyle priorities and preferred way of working."],["02","Understand the reality","Budget, time, geography, resources, constraints and the level of risk that is actually possible."],["03","Find the direction","Identify business territories that make sense at the intersection of personal fit and external opportunity."],["04","Shape the concept","Define the offer, audience, format, reason to exist and the first version of the positioning."],["05","Test the strategic logic","Pressure-test the idea against real needs, differentiation, feasibility and possible development."],["06","Build the brand","Create naming, narrative, personality, strategic territory and communication principles."],["07","Build the visual system","Translate the strategy into identity, digital direction, packaging, campaigns and touchpoints."],["08","Define what comes next","Map how the business and brand can expand while keeping a coherent core."]];return nav()+'<main class="page-view route-fade method-page"><div class="page-shell"><div class="page-kicker">Method</div><h1 class="page-title method-name-title">Venture Shaping</h1><div class="method-title-flow" aria-label="Person to Business to Brand"><div class="method-title-row method-title-row--top"><span>PERSON</span><span class="method-flow-arrow">→</span><span>BUSINESS</span></div><div class="method-title-row method-title-row--bottom"><span class="method-flow-arrow method-flow-arrow--continuation">→</span><span>BRAND</span></div></div><div class="page-intro"><div class="editorial-kicker">The principle</div><p>A business should work on paper and for the person running it. My process connects personal insight with practical constraints, commercial logic and brand-building.</p></div><section class="method-journey" aria-label="Eight-step method"><div class="method-journey-line" aria-hidden="true"></div>'+steps.map(function(s,i){var side=i%2===0?"left":"right";return '<article class="method-step method-step--'+side+'"><div class="method-step-content"><div class="method-step-label">Step '+s[0]+'</div><h3>'+s[1]+'</h3><p>'+s[2]+'</p></div><div class="method-step-node" aria-hidden="true"><span>'+s[0]+'</span></div></article>'}).join("")+'</section><section class="page-section method-astro-section"><div class="astrology-box"><h3>The astrological layer is optional.</h3><div><p>When relevant, I use natal astrology as an additional reflective framework for exploring recurring strengths, motivations, working patterns and areas of potential.</p><p>It does not replace research, financial judgment, market analysis or business strategy. It adds another perspective to the discovery stage and can be included or left out completely.</p></div></div></section><section class="page-section statement-section"><div class="statement-layout"><div class="editorial-kicker">The goal</div><div><h2 class="statement-title">Not a “hot niche”.<br/>A direction you can actually build.</h2><p class="statement-copy">The aim is not to manufacture certainty or promise an easy path. It is to make a more informed choice about what deserves your energy, then give that choice a strong strategic and visual form.</p>'+routeLink("#/start-a-project","Start the process","btn-primary")+'</div></div></section></div></main>'+footer()}
function aboutPage(){return nav()+'<main class="page-view route-fade"><div class="page-shell"><div class="page-kicker">About</div><h1 class="page-title">Aleksandra Iagovkina</h1><div class="about-story"><div class="about-story-label">Why this practice exists</div><div class="about-story-copy"><p>I became more interested in the question before the design.</p><p class="small">My background spans graphic design, brand identity, digital design, photography and creative direction. Over time, the most interesting part of the work became less “How should this brand look?” and more “Why should this brand exist at all, who should build it, and what would make it sustainable for that person?”</p><p class="small">That is why my practice now sits between business concept development, brand strategy and creative direction. I can help define the idea and then carry it into a name, identity, website direction, packaging and the wider visual system.</p></div></div><section class="page-section statement-section"><div class="statement-layout"><div class="editorial-kicker">What I bring</div><div><h2 class="statement-title">Strategy does not disappear<br/>into a deck.</h2><p class="statement-copy">I work across concept and execution, so the strategic decisions can continue all the way into the actual brand world. The thinking and the design stay connected.</p></div></div><div class="value-grid"><div class="value-card"><div class="num">01</div><h3>Concept thinking</h3><p>Finding the central idea and turning ambiguity into a direction.</p></div><div class="value-card"><div class="num">02</div><h3>Brand strategy</h3><p>Making audience, positioning, narrative and differentiation work as one system.</p></div><div class="value-card"><div class="num">03</div><h3>Creative direction</h3><p>Defining the visual language and maintaining coherence across touchpoints.</p></div><div class="value-card"><div class="num">04</div><h3>Design execution</h3><p>Taking the strategy into identity, digital, packaging and communication.</p></div></div></section>'+routeLink("#/start-a-project","Start a project","btn-primary")+'</div></main>'+footer()}
function startPage(){return nav()+'<main class="page-view route-fade"><div class="page-shell"><div class="page-kicker">Start a project</div><h1 class="page-title">Start a Project</h1><div class="page-intro"><div class="editorial-kicker">Begin here</div><p>You do not need a perfect brief. Tell me what you know so far. “I do not know yet” is also a valid answer.</p></div><div class="start-layout"><div class="start-copy"><h2>Where are you now?</h2><p>The form is designed to give me enough context for a useful first conversation, not to make you write a business plan before we speak.</p><p>If you prefer, you can contact me directly.</p><div class="start-links"><a href="https://t.me/twelveeyed" target="_blank" rel="noreferrer">Telegram</a><a href="https://wa.me/79967151380" target="_blank" rel="noreferrer">WhatsApp</a><a href="mailto:aleksandra.iagovkina@gmail.com">Email</a></div><p class="scope-note">Please note: I do not provide 3D modelling, website development/coding, complex animation production or print-vendor sourcing. I can prepare production-ready files and coordinate directly with your selected print house or other production specialist.</p></div><form class="project-form" id="project-form"><div class="form-field"><label for="pf-name">Name</label><input id="pf-name" name="name" required/></div><div class="form-field"><label for="pf-email">Email</label><input id="pf-email" name="email" type="email" required/></div><div class="form-field"><label for="pf-stage">Where are you currently?</label><select id="pf-stage" name="stage"><option>I do not know what business to build yet</option><option>I have several ideas</option><option>I already have a business idea</option><option>I have an existing brand</option></select></div><div class="form-field"><label for="pf-help">What would you like help with?</label><select id="pf-help" name="help"><option>Direction & Potential</option><option>Business concept</option><option>Naming / brand strategy</option><option>Visual identity</option><option>Full concept-to-brand</option><option>I am not sure yet</option></select></div><div class="form-field"><label for="pf-astro">Include the astrological layer?</label><select id="pf-astro" name="astro"><option>I am curious but not sure</option><option>Yes</option><option>No</option></select></div><div class="form-field"><label for="pf-budget">Approximate budget</label><select id="pf-budget" name="budget"><option>Not sure yet</option><option>Under €1,000</option><option>€1,000–€3,000</option><option>€3,000–€7,000</option><option>€7,000+</option></select></div><div class="form-field form-field--full"><label for="pf-timeline">Timeline</label><input id="pf-timeline" name="timeline" placeholder="When would you like to begin?"/></div><div class="form-field form-field--full"><label for="pf-details">Tell me about yourself / the project</label><textarea id="pf-details" name="details" placeholder="What are you thinking about, what feels unclear, and what would a useful outcome look like?"></textarea></div><button type="submit" class="btn-primary form-submit">Email this brief</button><div class="form-note">Submitting opens your email client with the brief pre-filled. Nothing is uploaded or stored by this page.</div></form></div></div></main>'+footer()}
function caseImageMarkup(img,i,caption,variant){
  if(!img){return '<div class="case-shot"><div class="case-placeholder">Image '+String(i+1).padStart(2,"0")+'</div></div>'}
  variant=variant||"full";
  var mobile=img+"-800.webp";
  var desktop=img+"-1440.webp";
  var hq=img+"-hq.webp";
  var eager=i===0;
  var isCadoo=img.indexOf("/cadoo/")!==-1;
  var forceOriginal=isCadoo && (variant==="full" || variant==="medium");
  var original=img+".png";
  var src=forceOriginal?original:((variant==="pair")?mobile:(variant==="full"?hq:desktop));
  var sizes=variant==="pair"
    ? "(max-width:800px) calc(100vw - 32px), min(760px, 48vw)"
    : variant==="narrow"
      ? "(max-width:800px) calc(100vw - 32px), min(1040px, 70vw)"
      : variant==="medium"
        ? "(max-width:800px) calc(100vw - 32px), min(1220px, 82vw)"
        : "(max-width:800px) calc(100vw - 32px), min(1600px, calc(100vw - 32px))";
  var responsive=forceOriginal?'':' srcset="'+mobile+' 800w, '+desktop+' 1440w, '+hq+' 1672w" sizes="'+sizes+'"';
  return '<div class="case-media case-media--'+variant+'"><div class="case-shot"><img src="'+src+'"'+responsive+' width="1672" height="941" alt="Project image '+(i+1)+'" loading="'+(eager?"eager":"lazy")+'" fetchpriority="'+(eager?"high":"low")+'" decoding="async"/></div>'+(caption?'<div class="case-caption">'+esc(caption)+'</div>':'')+'</div>'
}
function caseBlocks(p){
  if(!p.blocks){
    return '<div class="case-gallery">'+p.gallery.map(function(img,i){return caseImageMarkup(img,i,"","full")}).join("")+'</div>'
  }
  return '<div class="case-flow">'+p.blocks.map(function(block){
    if(block.type==="text"){
      return '<section class="case-text-block case-flow-item"><div class="case-text-kicker">'+esc(block.eyebrow||"")+'</div><div class="case-text-content"><h3>'+esc(block.title||"")+'</h3>'+block.body.map(function(t){return '<p>'+esc(t)+'</p>'}).join("")+'</div></section>'
    }
    if(block.type==="quote"){
      return '<section class="case-quote case-flow-item"><p>'+esc(block.text||"")+'</p></section>'
    }
    if(block.type==="pair"){
      var cls=block.variant||"even";
      return '<div class="case-pair case-pair--'+cls+' case-flow-item">'+block.images.map(function(idx,k){return caseImageMarkup(p.gallery[idx],idx,(block.captions||[])[k]||"","pair")}).join("")+'</div>'
    }
    if(block.type==="image"){
      var idx=block.images[0];
      return '<div class="case-flow-item">'+caseImageMarkup(p.gallery[idx],idx,block.caption||"",block.size||"full")+'</div>'
    }
    if(block.type==="feature"){
      var reverse=block.imageSide==="right";
      return '<section class="case-feature '+(reverse?"case-feature--image-right ":"")+'case-flow-item"><div class="case-feature-media">'+caseImageMarkup(p.gallery[block.image],block.image,block.caption||"","medium")+'</div><div class="case-feature-copy"><div class="case-feature-kicker">'+esc(block.eyebrow||"")+'</div><h3>'+esc(block.title||"")+'</h3>'+block.body.map(function(t){return '<p>'+esc(t)+'</p>'}).join("")+'</div></section>'
    }
    if(block.type==="closing"){
      return '<section class="case-closing case-flow-item"><div class="case-closing-kicker">'+esc(block.eyebrow||"")+'</div><div><h3>'+esc(block.title||"")+'</h3><p>'+esc(block.body||"")+'</p></div></section>'
    }
    return ''
  }).join("")+'</div>'
}

function projectPage(p){var idx=projects.findIndex(function(x){return x.slug===p.slug});var prev=projects[(idx-1+projects.length)%projects.length];var next=projects[(idx+1)%projects.length];var desc=p.description.map(function(t){return '<p>'+esc(t)+'</p>'}).join("");return nav()+'<article class="case-page route-fade"><div class="case-top"><a href="#/work" data-route="#/work" class="case-back">← Back to work</a><div class="case-concept-label">Self-initiated business &amp; brand concept</div><h1 class="case-title">'+esc(p.title)+'</h1><dl class="case-intro"><div class="case-fact"><dt>Project type</dt><dd>Self-initiated concept</dd></div><div class="case-fact"><dt>What I did</dt><dd>'+esc(p.role)+'</dd></div><div class="case-fact"><dt>Scope</dt><dd>'+esc(p.scope)+'</dd></div></dl><div class="case-description"><div class="case-description-label">Concept</div><div class="case-description-copy">'+desc+'</div></div></div>'+caseBlocks(p)+'<nav class="case-nav"><a href="#/work/'+prev.slug+'" data-project="'+prev.slug+'">Previous <span>'+esc(prev.title)+'</span></a><a href="#/work/'+next.slug+'" data-project="'+next.slug+'">Next <span>'+esc(next.title)+'</span></a></nav></article>'+footer()}

function initReveal(){
  var selectors=[
    ".hero-target h1",".hero-kicker",".hero-rule",".hero-copy",".hero-scroll",".hero-actions",
    ".editorial-kicker",".editorial-head h2",".editorial-lead",".stage-card",".path-step",".work-card",
    ".work-note",".method-column",".method-note",".service-card",".value-card",".about-preview h2",
    ".about-preview-copy p",".cta-panel h2",".cta-panel p",".page-kicker",".page-title",".page-intro",
    ".page-section-head",".service-detail",".method-step",".astrology-box",".about-story",".start-layout",
    ".case-back",".case-concept-label",".case-title",".case-fact",".case-description-label",
    ".case-description-copy",".case-text-block",".case-feature",".case-closing",".case-quote",
    ".case-shot",".case-caption",".case-nav a"
  ];
  var items=Array.from(document.querySelectorAll(selectors.join(",")));
  items.forEach(function(el){
    el.classList.add("reveal");
    var parent=el.parentElement;
    var siblings=parent ? Array.from(parent.children).filter(function(x){return items.indexOf(x)!==-1}) : [];
    var idx=Math.max(0,siblings.indexOf(el));
    el.style.setProperty("--reveal-delay", Math.min(idx*70,280)+"ms");
  });
  if(!("IntersectionObserver" in window)){items.forEach(function(el){el.classList.add("is-visible")});return}
  var observer=new IntersectionObserver(function(entries){entries.forEach(function(entry){if(entry.isIntersecting){entry.target.classList.add("is-visible");observer.unobserve(entry.target)}})},{threshold:.1,rootMargin:"0px 0px -6% 0px"});
  items.forEach(function(el){observer.observe(el)})
}
