<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Aleksandra Iagovkina — Portfolio Preview</title>
<meta name="description" content="Independent multidisciplinary designer and art director working across brand identity, graphic design, UI/UX and web."/>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png">
<style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap');


:root {
  --bg: #0a0a0a;
  --fg: #f2efea;
  --muted: #8d8d8d;
  --line: rgba(255,255,255,.14);
  --accent: #ad0026;
}

html {
  background: var(--bg);
  color: var(--fg);
  font-family: "DM Sans", sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  background:
    radial-gradient(1200px 800px at 65% 35%, rgba(255,255,255,.018), transparent 70%),
    linear-gradient(145deg, rgba(255,255,255,.012), transparent 45%),
    #0a0a0a;
}

* { box-sizing: border-box; }
a { color: inherit; text-decoration: none; }
::selection { background:#f2efea; color:#0a0a0a; }

.site-shell { width:min(1370px, calc(100% - 48px)); margin:0 auto; }

.target-header {
  position: fixed; inset: 0 0 auto 0; z-index: 50;
  padding: 0 24px;
  background: rgba(10,10,10,.54);
  border-bottom: 1px solid rgba(255,255,255,.09);
  -webkit-backdrop-filter: blur(18px) saturate(145%);
  backdrop-filter: blur(18px) saturate(145%);
  box-shadow: 0 10px 35px rgba(0,0,0,.16);
  mix-blend-mode: normal;
}
.target-header-inner {
  width:min(1810px, calc(100% - 0px)); margin:0 auto;
  min-height:72px;
  display:flex; align-items:center; justify-content:space-between;
}
.target-brand {
  display:flex;
  align-items:center;
  width:52px;
  height:32px;
  line-height:1;
}
.target-brand-mark {
  display:block;
  width:52px;
  height:32px;
  object-fit:contain;
}
.target-nav { display:flex; gap:36px; align-items:center; }
.target-nav a {
  font-size:12px; letter-spacing:.12em; text-transform:uppercase;
  transition:color .25s ease, opacity .25s ease;
}
.target-nav a:hover { color:var(--accent); opacity:1; }

.hero-target {
  min-height:100svh;
  display:flex;
  align-items:flex-end;
  padding:120px 24px 64px;
}
.hero-target-inner { width:min(1370px, calc(100% - 0px)); margin:0 auto; }
.hero-target h1 {
  margin:0;
  max-width:1120px;
  font-family:"Playfair Display", serif;
  font-weight:400;
  font-size:clamp(72px, 7.9vw, 148px);
  line-height:.83;
  letter-spacing:-.055em;
  text-transform:uppercase;
}
.hero-rule { height:1px; background:var(--line); margin-top:44px; }
.hero-bottom {
  display:grid;
  grid-template-columns:minmax(0, 1fr) 280px;
  gap:48px;
  padding-top:28px;
  align-items:end;
}
.hero-copy {
  max-width:470px;
  font-size:18px;
  line-height:1.45;
  letter-spacing:-.025em;
}
.hero-copy .muted { color:#777; }
.hero-scroll {
  justify-self:end;
  font-size:10px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:#777;
  padding-bottom:4px;
}

.section-target { padding:150px 24px; border-top:1px solid var(--line); }
.section-kicker { font-size:11px; letter-spacing:.15em; text-transform:uppercase; color:#8d8d8d; }
.section-title {
  margin:16px 0 70px;
  font-family:"Playfair Display", serif;
  font-size:clamp(54px, 6vw, 112px);
  line-height:.92; font-weight:400; letter-spacing:-.045em;
  text-transform:uppercase;
}

.work-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:86px 28px; }
.work-card { display:block; }
.work-media {
  width:100%;
  aspect-ratio:16/10;
  background:#111;
  overflow:hidden;
}
.work-media img {
  width:100%; height:100%; object-fit:cover; display:block;
  filter:contrast(1.018) saturate(1.008);
  transition:transform .5s cubic-bezier(.2,.7,.2,1), filter .35s ease;
  transform:translateZ(0);
}
.work-card:hover .work-media img { transform:scale(1.012); }
.work-placeholder {
  width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  border:1px solid rgba(255,255,255,.07);
  color:#3e3e3e; font-family:"Playfair Display",serif; font-size:40px;
}
.work-placeholder small {
  font-family:"DM Sans",sans-serif;
  font-size:9px;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:#555;
}
.work-meta {
  margin-top:18px; display:flex; justify-content:space-between; gap:24px; align-items:baseline;
  border-top:1px solid rgba(255,255,255,.12); padding-top:14px;
}
.work-title { font-family:"Playfair Display",serif; font-size:30px; transition:color .28s ease; }
.work-card:hover .work-title { color:var(--accent); }
.work-num { font-size:10px; letter-spacing:.15em; color:#777; }

.about-target { display:grid; grid-template-columns:1fr 1.35fr; gap:100px; align-items:start; }
.about-target h2 {
  margin:0; font-family:"Playfair Display",serif; font-size:clamp(64px,7vw,126px);
  font-weight:400; line-height:.88; letter-spacing:-.05em; text-transform:uppercase;
}
.about-copy { font-size:28px; line-height:1.35; letter-spacing:-.035em; }
.about-copy p { margin:0 0 30px; }
.about-copy .small { font-size:17px; line-height:1.55; color:#8d8d8d; max-width:700px; }

.contact-target { min-height:72vh; display:flex; align-items:flex-end; }
.contact-target h2 {
  margin:0;
  font-family:"Playfair Display",serif;
  font-size:clamp(64px,8vw,150px);
  line-height:.85; font-weight:400; letter-spacing:-.05em; text-transform:uppercase;
}
.contact-links { margin-top:46px; display:flex; gap:34px; flex-wrap:wrap; font-size:11px; letter-spacing:.14em; text-transform:uppercase; }
.contact-links a,
.case-back,
.case-nav a { transition:color .25s ease, opacity .25s ease; }
.contact-links a:hover,
.case-back:hover,
.case-nav a:hover { color:var(--accent); opacity:1; }

.case-page { padding:150px 24px 90px; }
.case-top { width:min(1370px,100%); margin:0 auto; }
.case-back { font-size:10px; letter-spacing:.15em; text-transform:uppercase; color:#888; }
.case-title {
  margin:74px 0 46px;
  font-family:"Playfair Display",serif;
  font-size:clamp(74px,9vw,164px);
  line-height:.84; font-weight:400; letter-spacing:-.055em; text-transform:uppercase;
}
.case-intro {
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  padding:30px 0 38px;
  display:grid;
  grid-template-columns:repeat(3, minmax(0,1fr));
  gap:40px;
}
.case-fact dt, .case-description-label {
  margin:0 0 12px; font-size:10px; letter-spacing:.15em; text-transform:uppercase; color:#777;
}
.case-fact dd { margin:0; min-height:30px; font-size:16px; }
.case-description {
  display:grid; grid-template-columns:1fr 2fr; gap:80px;
  padding:72px 0 104px;
}
.case-description-copy {
  min-height:150px;
  border-top:1px solid rgba(255,255,255,.09);
  padding-top:18px;
  color:#8d8d8d;
  font-size:17px; line-height:1.6;
}
.case-description-copy p { margin:0 0 22px; }
.case-description-copy p:last-child { margin-bottom:0; }
.case-gallery { width:min(1600px, calc(100% - 32px)); margin:0 auto; display:flex; flex-direction:column; gap:20px; }
.case-flow {
  width:min(1600px, calc(100% - 32px));
  margin:0 auto;
  display:flex;
  flex-direction:column;
  gap:0;
}
.case-flow-item { width:100%; }
.case-media { min-width:0; }
.case-media--full { width:100%; }
.case-media--medium { width:min(1220px, 82%); margin:0 auto; }
.case-media--narrow { width:min(1040px, 70%); margin:0 auto; }
.case-shot {
  width:100%;
  background:#0f0f0f;
  overflow:hidden;
  content-visibility:auto;
  contain-intrinsic-size:1600px 900px;
  box-shadow:0 18px 55px rgba(0,0,0,.22);
}
.case-shot img {
  width:100%;
  height:auto;
  display:block;
  image-rendering:auto;
  transform:translateZ(0);
}
.case-caption {
  margin-top:12px;
  padding:0 2px;
  max-width:680px;
  color:#85817d;
  font-size:9px;
  line-height:1.55;
  letter-spacing:.11em;
  text-transform:uppercase;
}
.case-pair {
  display:grid;
  gap:22px;
  align-items:start;
  margin:30px 0 96px;
}
.case-pair--even { grid-template-columns:repeat(2,minmax(0,1fr)); }
.case-pair--asym-left { grid-template-columns:minmax(0,1.22fr) minmax(0,.78fr); }
.case-pair--asym-right { grid-template-columns:minmax(0,.78fr) minmax(0,1.22fr); }
.case-pair > div { min-width:0; }
.case-text-block {
  width:min(1320px, calc(100% - 96px));
  margin:104px auto 98px;
  padding-top:38px;
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:minmax(160px,.48fr) minmax(0,1.52fr);
  gap:84px;
}
.case-text-kicker,
.case-feature-kicker,
.case-closing-kicker {
  font-size:10px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:#777;
}
.case-text-content h3,
.case-feature-copy h3 {
  margin:0 0 24px;
  max-width:820px;
  font-family:"Playfair Display",serif;
  font-weight:400;
  font-size:clamp(44px,4.5vw,76px);
  line-height:.96;
  letter-spacing:-.045em;
}
.case-text-content p,
.case-feature-copy p {
  margin:0 0 21px;
  max-width:820px;
  color:#9b9792;
  font-size:18px;
  line-height:1.72;
}
.case-feature {
  width:min(1420px, calc(100% - 64px));
  margin:104px auto;
  display:grid;
  grid-template-columns:minmax(0,1.38fr) minmax(360px,.62fr);
  gap:74px;
  align-items:center;
}
.case-feature--image-right {
  grid-template-columns:minmax(360px,.62fr) minmax(0,1.38fr);
}
.case-feature--image-right .case-feature-media { order:2; }
.case-feature--image-right .case-feature-copy { order:1; }
.case-feature-copy {
  padding:34px 0;
  border-top:1px solid var(--line);
  border-bottom:1px solid rgba(255,255,255,.06);
}
.case-feature-kicker { margin-bottom:24px; }
.case-feature-copy h3 { font-size:clamp(38px,3.8vw,64px); }
.case-feature-copy p { font-size:16px; line-height:1.7; }
.case-quote {
  width:min(1280px, calc(100% - 96px));
  margin:106px auto;
  padding:64px 0 68px;
  border-top:1px solid rgba(255,255,255,.15);
  border-bottom:1px solid rgba(255,255,255,.09);
  text-align:center;
}
.case-quote p {
  margin:0 auto;
  max-width:1040px;
  font-family:"Playfair Display",serif;
  font-weight:400;
  font-size:clamp(42px,5vw,80px);
  line-height:1.01;
  letter-spacing:-.05em;
}
.case-closing {
  width:min(1320px, calc(100% - 96px));
  margin:112px auto 44px;
  padding:44px 0 12px;
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:minmax(160px,.48fr) minmax(0,1.52fr);
  gap:84px;
}
.case-closing h3 {
  margin:0 0 24px;
  font-family:"Playfair Display",serif;
  font-weight:400;
  font-size:clamp(48px,5.2vw,88px);
  line-height:.94;
  letter-spacing:-.05em;
}
.case-closing p {
  margin:0;
  max-width:860px;
  color:#9b9792;
  font-size:19px;
  line-height:1.72;
}
.case-placeholder {
  aspect-ratio:16/9; border:1px solid rgba(255,255,255,.08);
  display:flex; align-items:flex-end; justify-content:flex-end; padding:18px;
  color:#343434; font-size:10px; letter-spacing:.15em; text-transform:uppercase;
}
.case-nav {
  width:min(1370px, calc(100% - 48px)); margin:90px auto 0;
  padding-top:28px; border-top:1px solid var(--line);
  display:flex; justify-content:space-between; gap:24px;
  font-size:10px; letter-spacing:.13em; text-transform:uppercase;
}
.case-nav span { font-family:"Playfair Display",serif; font-size:24px; text-transform:none; letter-spacing:0; margin-left:8px; }

.reveal {
  opacity:0;
  transform:translateY(24px);
  transition:
    opacity .72s cubic-bezier(.22,.61,.36,1),
    transform .72s cubic-bezier(.22,.61,.36,1);
  transition-delay:var(--reveal-delay,0ms);
  will-change:opacity,transform;
}
.reveal.is-visible {
  opacity:1;
  transform:translateY(0);
}
@media (prefers-reduced-motion: reduce) {
  .reveal,
  .reveal.is-visible {
    opacity:1;
    transform:none;
    transition:none;
  }
}

html,body,#app{min-height:100%}

const projects=[
{id:"1",slug:"cadoo",number:"01",title:"Cadoo",thumbnail:"https://cdn.jsdelivr.net/gh/alexandra-iagovkina/alexandra-iagovkina.github.io@59b51e74438cef60c40f2c542f882004efb193ff/preview/assets/cadoo/cadoo-03-800.webp",gallery:Array.from({length:10},function(_,i){return "https://cdn.jsdelivr.net/gh/alexandra-iagovkina/alexandra-iagovkina.github.io@59b51e74438cef60c40f2c542f882004efb193ff/preview/assets/cadoo/cadoo-"+String(i+1).padStart(2,"0")}),duration:"Independent Brand Project",role:"Art Direction · Brand Identity · Packaging · Visual System",scope:"Naming · Logo · Mascot · Packaging · Campaign Visuals · Social Media · Brand Applications",description:["Cadoo is a premium cat-care brand system built to feel expressive, emotionally warm and commercially polished. The project covers the brand from core identity through packaging, campaign imagery, product extensions and social communication.","The challenge was to give a playful mascot-led brand enough structure to scale. Every application needed to feel recognisable without looking like the exact same composition repeated again and again."],blocks:[
{type:"image",images:[0],size:"full",caption:"Outdoor communication translating the packaging system into a bold, recognisable brand-awareness visual."},
{type:"feature",image:1,imageSide:"left",eyebrow:"Concept",title:"A brand with a point of view",body:["Cadoo was designed to feel expressive rather than clinical. The mascot became a working part of the identity rather than an illustration placed on top of it.","The same character can lead a pack, become a cropped graphic device or act as a visual signature across campaign materials, which gives the system personality without sacrificing consistency."],caption:"Close-up packaging presentation focused on character, print detail and shelf presence."},
{type:"quote",text:"Playful in tone. Precise in system. Commercially polished in execution."},
{type:"pair",variant:"asym-left",images:[5,2],captions:["Product-range logic through colour grouping and repeated packaging architecture.","Hero range presentation with real-cat presence introducing warmth and scale."]},
{type:"text",eyebrow:"Visual system",title:"Recognition first, variation second",body:["The identity combines a compact wordmark, a strong outlined mascot and a controlled pastel palette. The eye detail, dark contour and simplified geometry act as fixed anchors while colour provides differentiation between recipes and categories.","The result is a system that can change its crop, scale and colour balance without losing recognition. That flexibility became essential once the brand moved beyond a single food package."]},
{type:"image",images:[8],size:"narrow",caption:"Identity system: recurring assets, colour relationships and character construction."},
{type:"feature",image:6,imageSide:"right",eyebrow:"Packaging architecture",title:"Built as a family, not a collection",body:["The hierarchy is deliberately consistent: brand and mascot first, product type and flavour second, functional information third. This gives the packs strong shelf impact while keeping navigation clear.","Sterilised and non-sterilised lines shift in colour and labelling, but their proportions, typography and information rhythm stay connected. New SKUs can be added without rebuilding the system."],caption:"Packaging close-up showing the system at product scale."},
{type:"pair",variant:"even",images:[3,4],captions:["Treats, bowls and catnip extend the identity into softer supporting formats.","Accessories translate the same visual DNA into collars, toys and scratching products."]},
{type:"text",eyebrow:"Brand world",title:"The system had to live beyond packaging",body:["Once the packaging language was stable, I extended it into adjacent cat-care categories and campaign touchpoints. The objective was not to repeat one mascot pose everywhere, but to preserve the same tone through colour, shape, illustration logic and hierarchy.","That makes the brand feel larger than a single product line. Each object has its own purpose and composition, while the overall world still reads immediately as Cadoo."]},
{type:"image",images:[7],size:"medium",caption:"Social direction combining product, mascot and lifestyle cues within a cleaner editorial frame."},
{type:"feature",image:9,imageSide:"left",eyebrow:"Art direction",title:"Soft, graphic and deliberately controlled",body:["The visual world uses pastel architectural environments, rounded forms, controlled shadows and generous negative space. Product imagery is staged so the pack remains the focal point rather than disappearing into decorative scenery.","Real cats bring warmth and tactility; the graphic packaging brings structure. Keeping those two layers in tension gives the campaign its friendly but polished character."],caption:"Final product system showing multiple SKUs working as one coherent family."},
{type:"closing",eyebrow:"System logic",title:"One visual DNA, many touchpoints",body:"The finished identity is modular rather than template-based. Logo, mascot, eye motif, palette and supporting graphics can be recombined across packaging, social content, outdoor communication and future product extensions without losing the core character of the brand."}
]},

const app=document.getElementById("app");
function esc(s){return String(s).replace(/[&<>"\']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","\'":"&#039;"}[m]})}
function nav(){return '<header class="target-header"><div class="target-header-inner"><a href="#" class="target-brand js-home" aria-label="Aleksandra Iagovkina — Home"><img src="../portfolio/assets/logo.png" alt="" class="target-brand-mark"/></a><nav class="target-nav" aria-label="Primary"><a href="#work" data-home-target="#work">Work</a><a href="#about" data-home-target="#about">About</a><a href="#contact" data-home-target="#contact">Contact</a></nav></div></header>'}
function home(){var cards=projects.map(function(p){var media=p.thumbnail?'<img src="'+p.thumbnail+'" alt="'+esc(p.title)+'" width="720" height="405" loading="lazy" decoding="async" fetchpriority="low"/>':'<div class="work-placeholder"><span>'+p.number+'</span><strong>'+esc(p.title)+'</strong><small>Visual coming soon</small></div>';return '<a href="#/work/'+p.slug+'" data-project="'+p.slug+'" class="work-card"><div class="work-media">'+media+'</div><div class="work-meta"><div class="work-title">'+esc(p.title)+'</div><div class="work-num">'+p.number+'</div></div></a>'}).join("");return nav()+'<main class="route-fade"><section class="hero-target"><div class="hero-target-inner"><h1>Aleksandra<br/>Iagovkina</h1><div class="hero-rule"></div><div class="hero-bottom"><p class="hero-copy"><span class="muted">Art Director &amp; Designer. </span>Creating precise identity systems from first mark through real-world applications.</p><div class="hero-scroll">Scroll to explore</div></div></div></section><section id="work" class="section-target"><div class="site-shell"><div class="section-kicker">Work</div><h2 class="section-title">Selected Projects</h2><div class="work-grid">'+cards+'</div></div></section><section id="about" class="section-target"><div class="site-shell about-target"><h2>About</h2><div class="about-copy"><p>Independent multidisciplinary designer and art director working across brand identity, graphic design, UI/UX and web. My focus today is increasingly on creative direction: defining the idea, visual language and system behind a project, then guiding it from concept to final execution.</p><p class="small">I lead the creative process, make key visual decisions, structure the work and maintain consistency across every touchpoint. Where appropriate, I delegate production and technical execution to junior designers while retaining art direction, review and quality control. This allows me to focus on concept, direction, decision-making and the overall coherence of the project.</p></div></div></section><section id="contact" class="section-target contact-target"><div class="site-shell"><div class="section-kicker">Contact</div><h2>Have a project<br/>in mind?</h2><div class="contact-links"><a href="https://t.me/twelveeyed" target="_blank" rel="noreferrer">Telegram</a><a href="https://wa.me/79967151380" target="_blank" rel="noreferrer">WhatsApp</a><a href="mailto:aleksandra.iagovkina@gmail.com">Email</a></div></div></section></main>'}
function caseImageMarkup(img,i,caption,variant){
  if(!img){return '<div class="case-shot"><div class="case-placeholder">Image '+String(i+1).padStart(2,"0")+'</div></div>'}
  variant=variant||"full";
  var mobile=img+"-800.webp";
  var desktop=img+"-1440.webp";
  var hq=img+"-hq.webp";
  var eager=i===0;
  var src=(variant==="pair")?mobile:(variant==="full"?hq:desktop);
  var sizes=variant==="pair"
    ? "(max-width:800px) calc(100vw - 32px), min(760px, 48vw)"
    : variant==="narrow"
      ? "(max-width:800px) calc(100vw - 32px), min(1040px, 70vw)"
      : variant==="medium"
        ? "(max-width:800px) calc(100vw - 32px), min(1220px, 82vw)"
        : "(max-width:800px) calc(100vw - 32px), min(1600px, calc(100vw - 32px))";
  return '<div class="case-media case-media--'+variant+'"><div class="case-shot"><img src="'+src+'" srcset="'+mobile+' 800w, '+desktop+' 1440w, '+hq+' 1672w" sizes="'+sizes+'" width="1672" height="941" alt="Project image '+(i+1)+'" loading="'+(eager?"eager":"lazy")+'" fetchpriority="'+(eager?"high":"low")+'" decoding="async"/></div>'+(caption?'<div class="case-caption">'+esc(caption)+'</div>':'')+'</div>'
}
function caseBlocks(p){
  if(!p.blocks){
    return '<div class="case-gallery">'+p.gallery.map(function(img,i){return caseImageMarkup(img,i,"","full")}).join("")+'</div>'
  }
  return '<div class="case-flow">'+p.blocks.map(function(block){
    if(block.type==="text"){
      return '<section class="case-text-block case-flow-item"><div class="case-text-kicker">'+esc(block.eyebrow||"")+'</div><div class="case-text-content"><h3>'+esc(block.title||"")+'</h3>'+block.body.map(function(t){return '<p>'+esc(t)+'</p>'}).join("")+'</div></section>'
    }
    if(block.type==="quote"){
      return '<section class="case-quote case-flow-item"><p>'+esc(block.text||"")+'</p></section>'
    }
    if(block.type==="pair"){
      var cls=block.variant||"even";
      return '<div class="case-pair case-pair--'+cls+' case-flow-item">'+block.images.map(function(idx,k){return caseImageMarkup(p.gallery[idx],idx,(block.captions||[])[k]||"","pair")}).join("")+'</div>'
    }
    if(block.type==="image"){
      var idx=block.images[0];
      return '<div class="case-flow-item">'+caseImageMarkup(p.gallery[idx],idx,block.caption||"",block.size||"full")+'</div>'
    }
    if(block.type==="feature"){
      var reverse=block.imageSide==="right";
      return '<section class="case-feature '+(reverse?"case-feature--image-right ":"")+'case-flow-item"><div class="case-feature-media">'+caseImageMarkup(p.gallery[block.image],block.image,block.caption||"","medium")+'</div><div class="case-feature-copy"><div class="case-feature-kicker">'+esc(block.eyebrow||"")+'</div><h3>'+esc(block.title||"")+'</h3>'+block.body.map(function(t){return '<p>'+esc(t)+'</p>'}).join("")+'</div></section>'
    }
    if(block.type==="closing"){
      return '<section class="case-closing case-flow-item"><div class="case-closing-kicker">'+esc(block.eyebrow||"")+'</div><div><h3>'+esc(block.title||"")+'</h3><p>'+esc(block.body||"")+'</p></div></section>'
    }
    return ''
  }).join("")+'</div>'
}
function projectPage(p){var idx=projects.findIndex(function(x){return x.slug===p.slug});var prev=projects[(idx-1+projects.length)%projects.length];var next=projects[(idx+1)%projects.length];var desc=p.description.map(function(t){return '<p>'+esc(t)+'</p>'}).join("");return nav()+'<article class="case-page route-fade"><div class="case-top"><a href="#work" data-home-target="#work" class="case-back">← Back to work</a><h1 class="case-title">'+esc(p.title)+'</h1><dl class="case-intro"><div class="case-fact"><dt>Duration</dt><dd>'+esc(p.duration)+'</dd></div><div class="case-fact"><dt>What I did</dt><dd>'+esc(p.role)+'</dd></div><div class="case-fact"><dt>Scope</dt><dd>'+esc(p.scope)+'</dd></div></dl><div class="case-description"><div class="case-description-label">Project description</div><div class="case-description-copy">'+desc+'</div></div></div>'+caseBlocks(p)+'<nav class="case-nav"><a href="#/work/'+prev.slug+'" data-project="'+prev.slug+'">Previous <span>'+esc(prev.title)+'</span></a><a href="#/work/'+next.slug+'" data-project="'+next.slug+'">Next <span>'+esc(next.title)+'</span></a></nav></article>'}
function render(){var m=location.hash.match(/^#\/work\/([^/]+)\/?$/);if(m){var p=projects.find(function(x){return x.slug===m[1]});app.innerHTML=p?projectPage(p):home()}else{app.innerHTML=home()}bind();requestAnimationFrame(initReveal)}
function toHome(target){location.hash=target;render();requestAnimationFrame(function(){var el=document.querySelector(target);if(el)el.scrollIntoView({behavior:"smooth"})})}
function initReveal(){
  var selectors=[
    ".hero-target h1",
    ".hero-rule",
    ".hero-copy",
    ".hero-scroll",
    ".section-kicker",
    ".section-title",
    ".work-card",
    ".about-target h2",
    ".about-copy p",
    ".contact-target h2",
    ".contact-links a",
    ".case-back",
    ".case-title",
    ".case-fact",
    ".case-description-label",
    ".case-description-copy",
    ".case-text-block",
    ".case-feature",
    ".case-closing",
    ".case-quote",
    ".case-shot",
    ".case-caption",
    ".case-nav a"
  ];
  var items=Array.from(document.querySelectorAll(selectors.join(",")));
  items.forEach(function(el){
    el.classList.add("reveal");
    var parent=el.parentElement;
    var siblings=parent ? Array.from(parent.children).filter(function(x){return items.indexOf(x)!==-1}) : [];
    var idx=Math.max(0,siblings.indexOf(el));
    el.style.setProperty("--reveal-delay", Math.min(idx*85,340)+"ms");
  });
  if(!("IntersectionObserver" in window)){
    items.forEach(function(el){el.classList.add("is-visible")});
    return;
  }
  var observer=new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){
        entry.target.classList.add("is-visible");
        observer.unobserve(entry.target);
      }
    });
  },{threshold:.12,rootMargin:"0px 0px -7% 0px"});
  items.forEach(function(el){observer.observe(el)});
}
function bind(){document.querySelectorAll("[data-project]").forEach(function(a){a.addEventListener("click",function(e){e.preventDefault();location.hash="/work/"+a.getAttribute("data-project");window.scrollTo(0,0)})});document.querySelectorAll("[data-home-target]").forEach(function(a){a.addEventListener("click",function(e){e.preventDefault();toHome(a.getAttribute("data-home-target"))})});document.querySelectorAll(".js-home").forEach(function(a){a.addEventListener("click",function(e){e.preventDefault();location.hash="";window.scrollTo(0,0);render()})})}
window.addEventListener("hashchange",function(){render();if(location.hash && !location.hash.startsWith("#/work/")){setTimeout(function(){var el=document.querySelector(location.hash);if(el)el.scrollIntoView()},0)}else{window.scrollTo(0,0)}});render();
(function(){
  var doPrefetch=function(){
    ["https://cdn.jsdelivr.net/gh/alexandra-iagovkina/alexandra-iagovkina.github.io@e81d95f2070aca67b0e330c1ea3ec4bfafaaef31/preview/assets/cadoo/cadoo-01-720.webp","https://cdn.jsdelivr.net/gh/alexandra-iagovkina/alexandra-iagovkina.github.io@e81d95f2070aca67b0e330c1ea3ec4bfafaaef31/preview/assets/cadoo/cadoo-02-720.webp"].forEach(function(url){
      var l=document.createElement("link");
      l.rel="prefetch";
      l.as="image";
      l.href=url;
      document.head.appendChild(l);
    });
  };
  if("requestIdleCallback" in window){requestIdleCallback(doPrefetch,{timeout:2500})}
  else{setTimeout(doPrefetch,1800)}
})();

if(location.hash&&!location.hash.startsWith("#/work/")){setTimeout(function(){var el=document.querySelector(location.hash);if(el)el.scrollIntoView()},0)}
</script>
