<html lang="en">
<head>
<meta charset="UTF-8"/>

<title>Aleksandra Iagovkina — Venture-to-Brand Strategist · Creative Director</title>
<meta name="description" content="Venture-to-Brand Strategist and Creative Director helping people define what is worth building, shape the venture, and turn it into a distinctive brand."/>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png">
<style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap');


:root {
  --bg: #0a0a0a;
  --fg: #f2efea;
  --muted: #8d8d8d;
  --line: rgba(255,255,255,.14);
  --accent: #ad0026;
}

html {
  background: var(--bg);
  color: var(--fg);
  font-family: "DM Sans", sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  background:
    radial-gradient(1200px 800px at 65% 35%, rgba(255,255,255,.018), transparent 70%),
    linear-gradient(145deg, rgba(255,255,255,.012), transparent 45%),
    #0a0a0a;
}

* { box-sizing: border-box; }
a { color: inherit; text-decoration: none; }
::selection { background:#f2efea; color:#0a0a0a; }

.site-shell { width:min(1370px, calc(100% - 48px)); margin:0 auto; }

.target-header {
  position: fixed; inset: 0 0 auto 0; z-index: 50;
  padding: 0 24px;
  background: rgba(10,10,10,.54);
  border-bottom: 1px solid rgba(255,255,255,.09);
  -webkit-backdrop-filter: blur(18px) saturate(145%);
  backdrop-filter: blur(18px) saturate(145%);
  box-shadow: 0 10px 35px rgba(0,0,0,.16);
  mix-blend-mode: normal;
}
.target-header-inner {
  width:min(1810px, calc(100% - 0px)); margin:0 auto;
  min-height:72px;
  display:flex; align-items:center; justify-content:space-between;
}
.target-brand {
  display:flex;
  align-items:center;
  width:52px;
  height:32px;
  line-height:1;
}
.target-brand-mark {
  display:block;
  width:52px;
  height:32px;
  object-fit:contain;
}
.target-nav { display:flex; gap:36px; align-items:center; }
.target-nav a {
  font-size:12px; letter-spacing:.12em; text-transform:uppercase;
  transition:color .25s ease, opacity .25s ease;
}
.target-nav a:hover { color:var(--accent); opacity:1; }

.hero-target {
  min-height:100svh;
  display:flex;
  align-items:flex-end;
  padding:120px 24px 64px;
}
.hero-target-inner { width:min(1370px, calc(100% - 0px)); margin:0 auto; }
.hero-target h1 {
  margin:0;
  max-width:1120px;
  font-family:"Playfair Display", serif;
  font-weight:400;
  font-size:clamp(72px, 7.9vw, 148px);
  line-height:.83;
  letter-spacing:-.055em;
  text-transform:uppercase;
}
.hero-rule { height:1px; background:var(--line); margin-top:44px; }
.hero-bottom {
  display:grid;
  grid-template-columns:minmax(0, 1fr) 280px;
  gap:48px;
  padding-top:28px;
  align-items:end;
}
.hero-copy {
  max-width:470px;
  font-size:18px;
  line-height:1.45;
  letter-spacing:-.025em;
}
.hero-copy .muted { color:#777; }
.hero-scroll {
  justify-self:end;
  font-size:10px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:#777;
  padding-bottom:4px;
}

.section-target { padding:150px 24px; border-top:1px solid var(--line); }
.section-kicker { font-size:11px; letter-spacing:.15em; text-transform:uppercase; color:#8d8d8d; }
.section-title {
  margin:16px 0 70px;
  font-family:"Playfair Display", serif;
  font-size:clamp(54px, 6vw, 112px);
  line-height:.92; font-weight:400; letter-spacing:-.045em;
  text-transform:uppercase;
}

.work-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:86px 28px; }
.work-card { display:block; }
.work-media {
  width:100%;
  aspect-ratio:16/10;
  background:#111;
  overflow:hidden;
}
.work-media img {
  width:100%; height:100%; object-fit:cover; display:block;
  filter:contrast(1.018) saturate(1.008);
  transition:transform .5s cubic-bezier(.2,.7,.2,1), filter .35s ease;
  transform:translateZ(0);
}
.work-card:hover .work-media img { transform:scale(1.012); }
.work-placeholder {
  width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  border:1px solid rgba(255,255,255,.07);
  color:#3e3e3e; font-family:"Playfair Display",serif; font-size:40px;
}
.work-placeholder small {
  font-family:"DM Sans",sans-serif;
  font-size:9px;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:#555;
}
.work-meta {
  margin-top:18px; display:flex; justify-content:space-between; gap:24px; align-items:baseline;
  border-top:1px solid rgba(255,255,255,.12); padding-top:14px;
}
.work-title { font-family:"Playfair Display",serif; font-size:30px; transition:color .28s ease; }
.work-card:hover .work-title { color:var(--accent); }
.work-num { font-size:10px; letter-spacing:.15em; color:#777; }

.about-target { display:grid; grid-template-columns:1fr 1.35fr; gap:100px; align-items:start; }
.about-target h2 {
  margin:0; font-family:"Playfair Display",serif; font-size:clamp(64px,7vw,126px);
  font-weight:400; line-height:.88; letter-spacing:-.05em; text-transform:uppercase;
}
.about-copy { font-size:28px; line-height:1.35; letter-spacing:-.035em; }
.about-copy p { margin:0 0 30px; }
.about-copy .small { font-size:17px; line-height:1.55; color:#8d8d8d; max-width:700px; }

.contact-target { min-height:72vh; display:flex; align-items:flex-end; }
.contact-target h2 {
  margin:0;
  font-family:"Playfair Display",serif;
  font-size:clamp(64px,8vw,150px);
  line-height:.85; font-weight:400; letter-spacing:-.05em; text-transform:uppercase;
}
.contact-links { margin-top:46px; display:flex; gap:34px; flex-wrap:wrap; font-size:11px; letter-spacing:.14em; text-transform:uppercase; }
.contact-links a,
.case-back,
.case-nav a { transition:color .25s ease, opacity .25s ease; }
.contact-links a:hover,
.case-back:hover,
.case-nav a:hover { color:var(--accent); opacity:1; }

.case-page { padding:150px 24px 90px; }
.case-top { width:min(1370px,100%); margin:0 auto; }
.case-back { font-size:10px; letter-spacing:.15em; text-transform:uppercase; color:#888; }
.case-title {
  margin:74px 0 46px;
  font-family:"Playfair Display",serif;
  font-size:clamp(74px,9vw,164px);
  line-height:.84; font-weight:400; letter-spacing:-.055em; text-transform:uppercase;
}
.case-intro {
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  padding:30px 0 38px;
  display:grid;
  grid-template-columns:repeat(3, minmax(0,1fr));
  gap:40px;
}
.case-fact dt, .case-description-label {
  margin:0 0 12px; font-size:10px; letter-spacing:.15em; text-transform:uppercase; color:#777;
}
.case-fact dd { margin:0; min-height:30px; font-size:16px; }
.case-description {
  display:grid; grid-template-columns:1fr 2fr; gap:80px;
  padding:72px 0 104px;
}
.case-description-copy {
  min-height:150px;
  border-top:1px solid rgba(255,255,255,.09);
  padding-top:18px;
  color:#8d8d8d;
  font-size:17px; line-height:1.6;
}
.case-description-copy p { margin:0 0 22px; }
.case-description-copy p:last-child { margin-bottom:0; }
.case-gallery { width:min(1600px, calc(100% - 32px)); margin:0 auto; display:flex; flex-direction:column; gap:20px; }
.case-flow {
  width:min(1600px, calc(100% - 32px));
  margin:0 auto;
  display:flex;
  flex-direction:column;
  gap:0;
}
.case-flow-item { width:100%; }
.case-media { min-width:0; }
.case-media--full { width:100%; }
.case-media--medium { width:min(1220px, 82%); margin:0 auto; }
.case-media--narrow { width:min(1040px, 70%); margin:0 auto; }
.case-shot {
  width:100%;
  background:#0f0f0f;
  overflow:hidden;
  content-visibility:auto;
  contain-intrinsic-size:1600px 900px;
  box-shadow:0 18px 55px rgba(0,0,0,.22);
}
.case-shot img {
  width:100%;
  height:auto;
  display:block;
  image-rendering:auto;
  filter:contrast(1.025) saturate(1.008);
  transform:translateZ(0);
}
.case-caption {
  margin-top:12px;
  padding:0 2px;
  max-width:680px;
  color:#85817d;
  font-size:9px;
  line-height:1.55;
  letter-spacing:.11em;
  text-transform:uppercase;
}
.case-pair {
  display:grid;
  gap:22px;
  align-items:start;
  margin:30px 0 96px;
}
.case-pair--even { grid-template-columns:repeat(2,minmax(0,1fr)); }
.case-pair--asym-left { grid-template-columns:minmax(0,1.22fr) minmax(0,.78fr); }
.case-pair--asym-right { grid-template-columns:minmax(0,.78fr) minmax(0,1.22fr); }
.case-pair > div { min-width:0; }
.case-text-block {
  width:min(1320px, calc(100% - 96px));
  margin:104px auto 98px;
  padding-top:38px;
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:minmax(160px,.48fr) minmax(0,1.52fr);
  gap:84px;
}
.case-text-kicker,
.case-feature-kicker,
.case-closing-kicker {
  font-size:10px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:#777;
}
.case-text-content h3,
.case-feature-copy h3 {
  margin:0 0 24px;
  max-width:820px;
  font-family:"Playfair Display",serif;
  font-weight:400;
  font-size:clamp(44px,4.5vw,76px);
  line-height:.96;
  letter-spacing:-.045em;
}
.case-text-content p,
.case-feature-copy p {
  margin:0 0 21px;
  max-width:820px;
  color:#9b9792;
  font-size:18px;
  line-height:1.72;
}
.case-feature {
  width:min(1420px, calc(100% - 64px));
  margin:104px auto;
  display:grid;
  grid-template-columns:minmax(0,1.38fr) minmax(360px,.62fr);
  gap:74px;
  align-items:center;
}
.case-feature--image-right {
  grid-template-columns:minmax(360px,.62fr) minmax(0,1.38fr);
}
.case-feature--image-right .case-feature-media { order:2; }
.case-feature--image-right .case-feature-copy { order:1; }
.case-feature-copy {
  padding:34px 0;
  border-top:1px solid var(--line);
  border-bottom:1px solid rgba(255,255,255,.06);
}
.case-feature-kicker { margin-bottom:24px; }
.case-feature-copy h3 { font-size:clamp(38px,3.8vw,64px); }
.case-feature-copy p { font-size:16px; line-height:1.7; }
.case-quote {
  width:min(1280px, calc(100% - 96px));
  margin:106px auto;
  padding:64px 0 68px;
  border-top:1px solid rgba(255,255,255,.15);
  border-bottom:1px solid rgba(255,255,255,.09);
  text-align:center;
}
.case-quote p {
  margin:0 auto;
  max-width:1040px;
  font-family:"Playfair Display",serif;
  font-weight:400;
  font-size:clamp(42px,5vw,80px);
  line-height:1.01;
  letter-spacing:-.05em;
}
.case-closing {
  width:min(1320px, calc(100% - 96px));
  margin:112px auto 44px;
  padding:44px 0 12px;
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:minmax(160px,.48fr) minmax(0,1.52fr);
  gap:84px;
}
.case-closing h3 {
  margin:0 0 24px;
  font-family:"Playfair Display",serif;
  font-weight:400;
  font-size:clamp(48px,5.2vw,88px);
  line-height:.94;
  letter-spacing:-.05em;
}
.case-closing p {
  margin:0;
  max-width:860px;
  color:#9b9792;
  font-size:19px;
  line-height:1.72;
}
.case-placeholder {
  aspect-ratio:16/9; border:1px solid rgba(255,255,255,.08);
  display:flex; align-items:flex-end; justify-content:flex-end; padding:18px;
  color:#343434; font-size:10px; letter-spacing:.15em; text-transform:uppercase;
}
.case-nav {
  width:min(1370px, calc(100% - 48px)); margin:90px auto 0;
  padding-top:28px; border-top:1px solid var(--line);
  display:flex; justify-content:space-between; gap:24px;
  font-size:10px; letter-spacing:.13em; text-transform:uppercase;
}
.case-nav span { font-family:"Playfair Display",serif; font-size:24px; text-transform:none; letter-spacing:0; margin-left:8px; }

.reveal {
  opacity:0;
  transform:translateY(24px);
  transition:
    opacity .72s cubic-bezier(.22,.61,.36,1),
    transform .72s cubic-bezier(.22,.61,.36,1);
  transition-delay:var(--reveal-delay,0ms);
  will-change:opacity,transform;
}
.reveal.is-visible {
  opacity:1;
  transform:translateY(0);
}
@media (prefers-reduced-motion: reduce) {
  .reveal,
  .reveal.is-visible {
    opacity:1;
    transform:none;
    transition:none;
  }
}

html,body,#app{min-height:100%}
html{scroll-padding-top:88px}
img{max-width:100%}
#work,#about,#contact{scroll-margin-top:88px}

/* Method title: directed two-line composition */
.method-title-flow{
  margin:50px 0 56px;
  padding-bottom:46px;
  border-bottom:1px solid var(--line);
  font-family:"Playfair Display",serif;
  font-weight:400;
  font-size:clamp(74px,9vw,154px);
  line-height:.84;
  letter-spacing:-.058em;
  text-transform:uppercase;
}
.method-title-row{
  display:flex;
  align-items:center;
  width:100%;
  white-space:nowrap;
}
.method-title-row--top{
  justify-content:flex-start;
  gap:.22em;
}
.method-title-row--bottom{
  justify-content:flex-start;
  gap:.18em;
}
.method-title-row--bottom > span:last-child{
  margin-left:auto;
}
.method-flow-arrow{
  color:var(--accent);
  font-family:"DM Sans",sans-serif;
  font-weight:300;
  font-size:.72em;
  line-height:1;
  letter-spacing:0;
  transform:translateY(-.05em);
}

/* Method journey: one continuous route, not anonymous boxes */
.method-journey{
  position:relative;
  width:min(1260px,100%);
  margin:34px auto 30px;
  padding:34px 0;
}
.method-journey-line{
  position:absolute;
  top:0;
  bottom:0;
  left:50%;
  width:1px;
  transform:translateX(-50%);
  background:linear-gradient(to bottom,transparent 0,var(--accent) 5%,var(--accent) 95%,transparent 100%);
  opacity:.72;
}
.method-step{
  position:relative;
  display:grid;
  grid-template-columns:minmax(0,1fr) 92px minmax(0,1fr);
  align-items:center;
  min-height:230px;
  padding:34px 0;
  border:0;
}
.method-step::before{
  content:"";
  position:absolute;
  top:50%;
  width:calc(50% - 46px);
  height:1px;
  background:linear-gradient(90deg,rgba(173,0,38,.08),rgba(173,0,38,.7));
}
.method-step--left::before{left:0}
.method-step--right::before{
  right:0;
  transform:scaleX(-1);
}
.method-step-content{
  max-width:510px;
  min-width:0;
}
.method-step--left .method-step-content{
  grid-column:1;
  justify-self:end;
  padding-right:42px;
  text-align:right;
}
.method-step--right .method-step-content{
  grid-column:3;
  justify-self:start;
  padding-left:42px;
}
.method-step--left .method-step-node{grid-column:2}
.method-step--right .method-step-node{grid-column:2;grid-row:1}
.method-step--right .method-step-spacer{grid-column:1;grid-row:1}
.method-step-node{
  z-index:2;
  width:58px;
  height:58px;
  justify-self:center;
  display:grid;
  place-items:center;
  border:1px solid var(--accent);
  border-radius:50%;
  background:#0a0a0a;
  box-shadow:0 0 0 10px #0a0a0a;
}
.method-step-node span{
  color:var(--accent);
  font-size:10px;
  letter-spacing:.14em;
}
.method-step-label{
  margin-bottom:16px;
  font-size:9px;
  letter-spacing:.16em;
  text-transform:uppercase;
}
.method-step h3{
  margin:0 0 15px;
  font-family:"Playfair Display",serif;
  font-weight:400;
  font-size:clamp(34px,3vw,48px);
  line-height:1.03;
  letter-spacing:-.035em;
}
.method-step p{
  margin:0;
  color:#918d88;
  font-size:15px;
  line-height:1.68;
}
.method-step--left .method-step-label,
.method-step--left p{margin-left:auto}
.method-astro-section{margin-top:28px}

/* Existing home process gets clearer accents without turning into a second timeline */
.path-step{
  position:relative;
  transition:border-color .25s ease,background .25s ease;
}
.path-step::after{
  content:"→";
  position:absolute;
  right:22px;
  top:20px;
  color:var(--accent);
  font-size:18px;
  opacity:.72;
}
.path-step:last-child::after{content:"•"}
.path-step h3{font-size:34px}
.path-step:hover{background:rgba(173,0,38,.035);border-color:rgba(173,0,38,.5)}

/* Cards get a visible hierarchy */

function methodPage(){var steps=[["01","Read what already exists","Experience, strengths, recurring patterns, motivations, resources, limits and preferred way of working."],["02","Name the real question","What is changing, what no longer fits, and what the next chapter actually has to solve."],["03","Build possible directions","Generate paths from real assets rather than from trends or category imitation."],["04","Choose the direction","Compare the options against personal fit, commercial logic, feasibility and sustainability."],["05","Shape the business","Define the offer, audience, format, position and the assumptions that need testing."],["06","Build the brand","Translate the strategic idea into naming, narrative, identity and the key touchpoints the venture needs."]];return nav()+'<main class="page-view route-fade method-page"><div class="page-shell"><div class="page-kicker">Method</div><h1 class="page-title method-name-title">Venture Shaping</h1><div class="method-title-flow" aria-label="Person to Direction to Business to Brand"><div class="method-title-row method-title-row--top"><span>Person</span><span class="method-flow-arrow">→</span><span>Direction</span></div><div class="method-title-row method-title-row--bottom"><span>Business</span><span class="method-flow-arrow">→</span><span>Brand</span></div></div><div class="page-intro"><div class="editorial-kicker">The principle</div><p>Strategy starts before identity. First we understand what is already true, then decide what is worth building, then give it a coherent business and visual form.</p></div><section class="method-journey" aria-label="Six-step method"><div class="method-journey-line" aria-hidden="true"></div>'+steps.map(function(s,i){var side=i%2===0?"left":"right";return '<article class="method-step method-step--'+side+'"><div class="method-step-content"><div class="method-step-label">Step '+s[0]+'</div><h3>'+s[1]+'</h3><p>'+s[2]+'</p></div><div class="method-step-node" aria-hidden="true"><span>'+s[0]+'</span></div></article>'}).join("")+'</section><section class="quote-break quote-break--compact"><div class="quote-break-inner"><blockquote>The goal is not to copy a market<br/>It is to find a direction worth building</blockquote></div></section><section class="page-section method-astro-section"><div class="astrology-box"><h3>An optional reflective layer, not the business case</h3><div><p>When useful, natal astrology can add another lens on recurring strengths, motivations, tensions and working patterns.</p><p>It does not choose the venture, predict commercial success or replace research. The final direction still has to make sense in practical and strategic terms.</p></div></div></section><section class="page-section statement-section"><div class="statement-layout"><div class="editorial-kicker">The outcome</div><div><h2 class="statement-title">A direction you can explain<br/>defend and build</h2><p class="statement-copy">The goal is enough clarity to commit, enough logic to test and enough character to become a distinctive brand.</p>'+routeLink("#/start-a-project","Start a conversation","btn-primary")+'</div></div></section></div></main>'+footer()}

function aboutPage(){return nav()+'<main class="page-view route-fade about-page"><div class="page-shell"><section class="about-page-hero"><div class="about-page-hero-copy"><div class="page-kicker">About</div><h1 class="page-title">Aleksandra Iagovkina</h1><p class="about-hero-role">Venture-to-Brand Strategist · Creative Director</p></div><div class="about-page-hero-visual"><img class="decor-blob about-page-blob" src="./assets/decor/red-blob.webp" width="1400" height="1311" alt="" aria-hidden="true"/><img class="about-page-portrait" src="./assets/decor/portrait.webp" width="1200" height="1681" alt="Aleksandra Iagovkina" loading="eager" decoding="async"/><img class="decor-star about-page-star about-page-star--a" src="./assets/decor/stars-a.webp" width="64" height="106" alt="" aria-hidden="true"/><img class="decor-star about-page-star about-page-star--b" src="./assets/decor/stars-b.webp" width="83" height="68" alt="" aria-hidden="true"/></div></section><div class="about-story"><div class="about-story-label">Why this practice exists</div><div class="about-story-copy"><p>After more than 12 years in design, the question that interests me most is no longer “what should this brand look like?” It is “what is actually worth building, and what would make it coherent for this person?”</p><p class="small">I have worked across graphic design, identity, digital design, photography and creative direction. That breadth is useful because I can see the venture before it gets divided into departments: the person, the idea, the commercial logic, the story and the visual system.</p><p class="small">I am less interested in chasing the dominant aesthetic of a category and more interested in finding the specific logic and character that make a brand recognisable as itself.</p></div></div><section class="page-section accent-section accent-section--ivory about-philosophy"><div class="page-section-head"><div class="editorial-kicker">The worldview</div><div><h2>Commercially grounded<br/>personally coherent</h2><p>A direction becomes stronger when market reality and personal fit are considered together rather than treated as competing ideas.</p></div></div><div class="value-grid"><div class="value-card"><div class="num">01</div><h3>Pattern recognition</h3><p>I look for the strengths, contradictions and assets that are easy to miss when you are standing inside your own situation.</p></div><div class="value-card"><div class="num">02</div><h3>Strategic synthesis</h3><p>Personal fit, market logic, resources and constraints have to resolve into one direction that can survive contact with reality.</p></div><div class="value-card"><div class="num">03</div><h3>Creative translation</h3><p>The reasoning should remain visible in the name, story, identity, interface, packaging and other key touchpoints.</p></div><div class="value-card"><div class="num">04</div><h3>Selective execution</h3><p>I stay close to the decisions that matter and collaborate or hand off where specialist production is the better answer.</p></div></div></section><section class="page-section statement-section about-role-section"><div class="statement-layout"><div class="editorial-kicker">The role</div><div><h2 class="statement-title">A thinking partner<br/>with a designer&#39;s hands</h2><p class="statement-copy">The advantage of working across strategy and creative direction is continuity. The reasoning does not disappear when the design begins.</p></div></div></section><div class="about-close">'+routeLink("#/start-a-project","Start a conversation","btn-primary")+'</div></div></main>'+footer()}

  if(/\.(?:webp|png|jpe?g)$/i.test(img)){
    var eagerDirect=i===0;
    return '<div class="case-media case-media--'+variant+'"><div class="case-shot"><img src="'+img+'" width="1672" height="941" alt="Project image '+(i+1)+'" loading="'+(eagerDirect?"eager":"lazy")+'" fetchpriority="'+(eagerDirect?"high":"low")+'" decoding="async"/></div>'+(caption?'<div class="case-caption">'+esc(caption)+'</div>':'')+'</div>'
  }
  var mobile=img+"-800.webp";
  var desktop=img+"-1440.webp";
  var hq=img+"-hq.webp";
  var eager=i===0;
  var isCadoo=img.indexOf("/cadoo/")!==-1;
  var forceOriginal=isCadoo && (variant==="full" || variant==="medium");
  var original=img+".png";
  var src=forceOriginal?original:((variant==="pair")?mobile:(variant==="full"?hq:desktop));
  var sizes=variant==="pair"
    ? "(max-width:800px) calc(100vw - 32px), min(760px, 48vw)"
    : variant==="narrow"
      ? "(max-width:800px) calc(100vw - 32px), min(1040px, 70vw)"
      : variant==="medium"
        ? "(max-width:800px) calc(100vw - 32px), min(1220px, 82vw)"
        : "(max-width:800px) calc(100vw - 32px), min(1600px, calc(100vw - 32px))";
  var responsive=forceOriginal?'':' srcset="'+mobile+' 800w, '+desktop+' 1440w, '+hq+' 1672w" sizes="'+sizes+'"';
  return '<div class="case-media case-media--'+variant+'"><div class="case-shot"><img src="'+src+'"'+responsive+' width="1672" height="941" alt="Project image '+(i+1)+'" loading="'+(eager?"eager":"lazy")+'" fetchpriority="'+(eager?"high":"low")+'" decoding="async"/></div>'+(caption?'<div class="case-caption">'+esc(caption)+'</div>':'')+'</div>'
}
function caseBlocks(p){
  if(!p.blocks){
    return '<div class="case-gallery">'+p.gallery.map(function(img,i){return caseImageMarkup(img,i,"","full")}).join("")+'</div>'
  }
  return '<div class="case-flow">'+p.blocks.map(function(block){
    if(block.type==="text"){
      return '<section class="case-text-block case-flow-item"><div class="case-text-kicker">'+esc(block.eyebrow||"")+'</div><div class="case-text-content"><h3>'+esc(block.title||"")+'</h3>'+block.body.map(function(t){return '<p>'+esc(t)+'</p>'}).join("")+'</div></section>'
    }
    if(block.type==="quote"){
      return '<section class="case-quote case-flow-item"><p>'+esc(block.text||"")+'</p></section>'
    }
    if(block.type==="pair"){
      var cls=block.variant||"even";
      return '<div class="case-pair case-pair--'+cls+' case-flow-item">'+block.images.map(function(idx,k){return caseImageMarkup(p.gallery[idx],idx,(block.captions||[])[k]||"","pair")}).join("")+'</div>'
    }
    if(block.type==="image"){
      var idx=block.images[0];
      return '<div class="case-flow-item">'+caseImageMarkup(p.gallery[idx],idx,block.caption||"",block.size||"full")+'</div>'
    }
    if(block.type==="feature"){
      var reverse=block.imageSide==="right";
      return '<section class="case-feature '+(reverse?"case-feature--image-right ":"")+'case-flow-item"><div class="case-feature-media">'+caseImageMarkup(p.gallery[block.image],block.image,block.caption||"","medium")+'</div><div class="case-feature-copy"><div class="case-feature-kicker">'+esc(block.eyebrow||"")+'</div><h3>'+esc(block.title||"")+'</h3>'+block.body.map(function(t){return '<p>'+esc(t)+'</p>'}).join("")+'</div></section>'
    }
    if(block.type==="closing"){
      return '<section class="case-closing case-flow-item"><div class="case-closing-kicker">'+esc(block.eyebrow||"")+'</div><div><h3>'+esc(block.title||"")+'</h3><p>'+esc(block.body||"")+'</p></div></section>'
    }
    return ''
  }).join("")+'</div>'
}

function projectPage(p){var idx=projects.findIndex(function(x){return x.slug===p.slug});var prev=projects[(idx-1+projects.length)%projects.length];var next=projects[(idx+1)%projects.length];var desc=p.description.map(function(t){return '<p>'+esc(t)+'</p>'}).join("");return nav()+'<article class="case-page route-fade"><div class="case-top"><a href="#/work" data-route="#/work" class="case-back">← Back to work</a><div class="case-concept-label">Self-initiated venture &amp; brand concept</div><h1 class="case-title">'+esc(p.title)+'</h1><dl class="case-intro"><div class="case-fact"><dt>Project type</dt><dd>Self-initiated venture concept</dd></div><div class="case-fact"><dt>What I did</dt><dd>'+esc(p.role)+'</dd></div><div class="case-fact"><dt>Scope</dt><dd>'+esc(p.scope)+'</dd></div></dl><div class="case-description"><div class="case-description-label">Concept</div><div class="case-description-copy">'+desc+'</div></div></div>'+caseBlocks(p)+'<nav class="case-nav"><a href="#/work/'+prev.slug+'" data-project="'+prev.slug+'">Previous <span>'+esc(prev.title)+'</span></a><a href="#/work/'+next.slug+'" data-project="'+next.slug+'">Next <span>'+esc(next.title)+'</span></a></nav></article>'+footer()}
function cleanHeadingPunctuation(){
  document.querySelectorAll("h1,h2,h3,h4,.page-title,.statement-title,.case-title").forEach(function(el){
    var w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);
    var nodes=[],n;
    while((n=w.nextNode())) nodes.push(n);
    for(var i=nodes.length-1;i>=0;i--){
      if(nodes[i].nodeValue.trim()){
        nodes[i].nodeValue=nodes[i].nodeValue.replace(/\.\s*$/,"");
        break;
      }
    }
  });
}
function render(){
  document.body.classList.remove("menu-open");
  var h=location.hash||"";
  var m=h.match(/^#\/work\/([^/]+)\/?$/);
  if(m){var p=projects.find(function(x){return x.slug===m[1]});app.innerHTML=p?projectPage(p):workPage()}
  else if(h==="#/work"){app.innerHTML=workPage()}
  else if(h==="#/services"){app.innerHTML=servicesPage()}
  else if(h==="#/method"){app.innerHTML=methodPage()}
  else if(h==="#/about"){app.innerHTML=aboutPage()}
  else if(h==="#/start-a-project"){app.innerHTML=startPage()}
  else{app.innerHTML=home()}
  cleanHeadingPunctuation();
  bind();
  requestAnimationFrame(initReveal)
}
function toRoute(target){if(location.hash===target){render();window.scrollTo(0,0)}else{location.hash=target}}
function initReveal(){
  var selectors=[
    ".hero-kicker",".hero-home-final h1",".hero-signature-v4",".hero-visual-v4",
    ".editorial-head",".editorial-pause-inner",".work-card",".about-page-hero-copy",
    ".about-page-hero-visual",".page-title",".page-intro",".case-title",".case-description",
    ".case-text-block",".case-feature",".case-closing",".case-quote"
  ];
  var items=Array.from(document.querySelectorAll(selectors.join(",")));
  items.forEach(function(el){
    el.classList.add("reveal");
    var parent=el.parentElement;
    var siblings=parent ? Array.from(parent.children).filter(function(x){return items.indexOf(x)!==-1}) : [];
    var idx=Math.max(0,siblings.indexOf(el));
    el.style.setProperty("--reveal-delay", Math.min(idx*70,280)+"ms");
  });
  if(!("IntersectionObserver" in window)){items.forEach(function(el){el.classList.add("is-visible")});return}
  var observer=new IntersectionObserver(function(entries){entries.forEach(function(entry){if(entry.isIntersecting){entry.target.classList.add("is-visible");observer.unobserve(entry.target)}})},{threshold:.1,rootMargin:"0px 0px -6% 0px"});
  items.forEach(function(el){observer.observe(el)})
}
function bind(){
  var menuToggle=document.querySelector(".target-menu-toggle");
  var mobileMenu=document.querySelector(".mobile-menu");
  if(menuToggle&&mobileMenu){
    menuToggle.addEventListener("click",function(){
      var open=!document.body.classList.contains("menu-open");
      document.body.classList.toggle("menu-open",open);
      menuToggle.setAttribute("aria-expanded",open?"true":"false");
      menuToggle.setAttribute("aria-label",open?"Close menu":"Open menu");
      mobileMenu.setAttribute("aria-hidden",open?"false":"true");
    });
  }
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"&&document.body.classList.contains("menu-open")){
      document.body.classList.remove("menu-open");
      if(menuToggle){menuToggle.setAttribute("aria-expanded","false");menuToggle.setAttribute("aria-label","Open menu")}
      if(mobileMenu){mobileMenu.setAttribute("aria-hidden","true")}
    }
  },{once:true});
  document.querySelectorAll("[data-project]").forEach(function(a){a.addEventListener("click",function(e){e.preventDefault();toRoute("#/work/"+a.getAttribute("data-project"))})});
  document.querySelectorAll("[data-route]").forEach(function(a){a.addEventListener("click",function(e){e.preventDefault();toRoute(a.getAttribute("data-route"))})});
  document.querySelectorAll(".js-home").forEach(function(a){a.addEventListener("click",function(e){e.preventDefault();location.hash="";window.scrollTo(0,0);render()})});
  var form=document.getElementById("project-form");
  if(form){form.addEventListener("submit",function(e){e.preventDefault();var fd=new FormData(form);var body=[
    "Name: "+(fd.get("name")||""),
    "Email: "+(fd.get("email")||""),
    "",
    "What I am trying to figure out:",
    fd.get("decision")||"",
    "",
    "What I already have to build from:",
    fd.get("assets")||"",
    "",
    "Timing / links / additional context:",
    fd.get("details")||""
  ].join("\n");window.location.href="mailto:aleksandra.iagovkina@gmail.com?subject="+encodeURIComponent("Website inquiry from "+(fd.get("name")||"website"))+"&body="+encodeURIComponent(body)})}
}
window.addEventListener("hashchange",function(){render();window.scrollTo(0,0)});
render();
(function(){
  var doPrefetch=function(){
    ["https://cdn.jsdelivr.net/gh/alexandra-iagovkina/alexandra-iagovkina.github.io@e81d95f2070aca67b0e330c1ea3ec4bfafaaef31/preview/assets/cadoo/cadoo-01-720.webp","https://cdn.jsdelivr.net/gh/alexandra-iagovkina/alexandra-iagovkina.github.io@e81d95f2070aca67b0e330c1ea3ec4bfafaaef31/preview/assets/cadoo/cadoo-02-720.webp"].forEach(function(url){
      var l=document.createElement("link");
      l.rel="prefetch";
      l.as="image";
      l.href=url;
      document.head.appendChild(l);
    });
  };
  if("requestIdleCallback" in window){requestIdleCallback(doPrefetch,{timeout:2500})}
  else{setTimeout(doPrefetch,1800)}
})();

</script>
